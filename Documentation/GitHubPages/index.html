<!doctype html>
<!--
  ADR TechDocs prototype — standalone publish-ready file.
  No build step or external assets are required.
  For GitHub Pages, this file can be served directly or renamed to index.html by the publisher.

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Interactive ADR TechDocs prototype for finding, publishing and managing government data." />
  <title>Connected Services | B.C. government DevHub</title>
  <style>
:root {
  --bc-navy: #003366;
  --bc-navy-dark: #00264d;
  --bc-blue: #1a5a96;
  --bc-blue-hover: #174f83;
  --bc-blue-light: #e8f1f8;
  --bc-yellow: #fdbf14;
  --bc-yellow-dark: #d89f00;
  --text: #252525;
  --muted: #5b616b;
  --border: #d8d8d8;
  --surface: #ffffff;
  --surface-soft: #f6f6f6;
  --info-bg: #eef6fb;
  --shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
  --focus: 0 0 0 3px #ffffff, 0 0 0 6px #2e5dd7;
  --sidebar: 206px;
  --radius: 3px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; color: var(--text); font-family: "BC Sans", Arial, sans-serif; font-size: 16px; line-height: 1.55; background: var(--surface); }
button, input { font: inherit; }
a { color: var(--bc-blue); }
a:hover { color: var(--bc-blue-hover); }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: none; box-shadow: var(--focus); }
.svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr-only { position: absolute!important; width: 1px!important; height: 1px!important; padding: 0!important; margin: -1px!important; overflow: hidden!important; clip: rect(0,0,0,0)!important; white-space: nowrap!important; border: 0!important; }
.skip-link { position: fixed; top: -100px; left: 16px; z-index: 9999; background: white; padding: 10px 14px; border: 3px solid var(--bc-yellow); color: var(--bc-navy); font-weight: 700; }
.skip-link:focus { top: 16px; }
.global-sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar); background: var(--bc-navy); color: white; z-index: 1000; overflow-y: auto; }
.sidebar-brand { min-height: 122px; padding: 24px 17px 18px; display: flex; align-items: flex-start; justify-content: flex-start; }
.bc-logo-link { display: inline-flex; align-items: center; max-width: 100%; }
.bc-logo { display: block; width: 169px; max-width: 100%; height: auto; }
.sidebar-close { display: none; color: white; }
.global-nav { padding-top: 6px; border-top: 1px solid rgba(255,255,255,.25); }
.global-nav-item { width: 100%; min-height: 52px; padding: 0 20px; border: 0; border-bottom: 1px solid rgba(255,255,255,.15); background: transparent; color: white; display: flex; align-items: center; gap: 12px; font-weight: 700; text-decoration: none; cursor: pointer; text-align: left; }
.global-nav-item svg { width: 20px; height: 20px; flex: 0 0 20px; }
.global-nav-item:hover { background: rgba(255,255,255,.09); color: white; }
.global-nav-item.active { box-shadow: inset 0 3px 0 #61a7ff, inset 0 -3px 0 #61a7ff; background: rgba(255,255,255,.035); }
.app-shell { margin-left: var(--sidebar); min-height: 100vh; }
.mobile-topbar { display: none; }
.devhub-header { padding: 42px 48px 34px; border-bottom: 1px solid #ececec; background: white; }
.devhub-title-row { max-width: 1500px; margin: 0 auto; display: flex; gap: 20px; align-items: stretch; }
.yellow-rule { width: 4px; background: var(--bc-yellow); flex: 0 0 4px; }
.eyebrow { color: var(--bc-blue); font-weight: 700; font-size: 14px; letter-spacing: .025em; text-transform: uppercase; margin-bottom: 2px; }
.devhub-title { font-size: clamp(30px, 3vw, 42px); line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
.devhub-title-row p { margin: 8px 0 0; max-width: 1000px; color: #333; }
.search-wrap { max-width: 1000px; margin: 28px auto 0; position: relative; display: flex; align-items: center; border: 1px solid #8d8d8d; border-radius: 999px; min-height: 58px; box-shadow: 0 4px 11px rgba(0,0,0,.12); background: white; }
.search-wrap > svg { width: 24px; height: 24px; margin-left: 20px; color: #444; }
.search-wrap input { border: 0; outline: 0; flex: 1; padding: 14px 16px; background: transparent; min-width: 0; }
.search-wrap button { border: 0; background: transparent; padding: 14px 22px; color: #333; cursor: pointer; }
.search-results { position: absolute; top: calc(100% + 8px); left: 14px; right: 14px; border: 1px solid var(--border); background: white; box-shadow: var(--shadow); z-index: 100; border-radius: var(--radius); display: none; max-height: 340px; overflow-y: auto; }
.search-results.open { display: block; }
.search-result { display: block; width: 100%; padding: 12px 16px; border: 0; border-bottom: 1px solid #ececec; text-align: left; background: white; cursor: pointer; }
.search-result:hover, .search-result:focus { background: var(--bc-blue-light); }
.search-result strong { display: block; color: var(--bc-blue); }
.search-result span { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.search-empty { padding: 16px; color: var(--muted); }
main { background: var(--surface-soft); min-height: calc(100vh - 240px); }
.docs-shell { max-width: 1540px; margin: 0 auto; padding: 32px 48px 80px; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 44px; align-items: start; }
.local-nav { position: sticky; top: 24px; background: white; border: 1px solid var(--border); box-shadow: 0 1px 3px rgba(0,0,0,.08); max-height: calc(100vh - 48px); overflow-y: auto; }
.local-nav-title { margin: 0; padding: 18px 18px 14px; font-size: 19px; color: var(--bc-navy); border-bottom: 4px solid var(--bc-yellow); }
.local-nav-group { border-bottom: 1px solid #e6e6e6; padding-bottom: 7px; }
.local-nav-group:last-child { border-bottom: 0; }
.local-nav-group-label {
  display: block;
  padding: 13px 16px 9px;
  color: #333;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0;
  text-decoration: none;
  border-left: 4px solid transparent;
  line-height: 1.35;
}
.local-nav a.local-nav-group-label:hover { background: #f2f7fb; color: var(--bc-navy); }
.local-nav a.local-nav-group-label.section-active { color: var(--bc-navy); background: #f8fafc; }
.local-nav a { display: block; padding: 7px 14px 7px 20px; color: var(--bc-blue); text-decoration: none; border-left: 4px solid transparent; line-height: 1.35; }
.local-nav a.local-nav-child { padding-left: 30px; }
.local-nav a.local-nav-level-1 { padding: 10px 14px 10px 18px; font-weight: 600; }
.local-nav a.local-nav-level-2, .local-nav .local-nav-static.local-nav-level-2 { padding-left: 34px; }
.local-nav a.local-nav-level-3 { padding-left: 50px; }
.local-nav .local-nav-static { display: block; padding: 8px 14px 8px 20px; color: #333; line-height: 1.35; font-weight: 600; }
.local-nav .local-nav-static.section-active { background: #f8fafc; color: var(--bc-navy); }
.local-nav .local-nav-tree { padding: 6px 0 8px; border-bottom: 1px solid #e6e6e6; }
.local-nav .local-nav-tree:last-child { border-bottom: 0; }
.local-nav a:hover { background: #f2f7fb; }
.local-nav a.active { background: var(--bc-blue-light); color: var(--bc-navy); border-left-color: var(--bc-yellow); font-weight: 700; }
.local-nav-toggle { display: none; }
.article { background: white; border: 1px solid #e1e1e1; padding: 38px 48px 48px; min-width: 0; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.breadcrumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; font-size: 14px; margin-bottom: 18px; color: var(--muted); }
.breadcrumbs a { text-decoration: none; }
.breadcrumbs svg { width: 14px; height: 14px; color: #777; }
.article h1 { font-size: clamp(34px, 4vw, 48px); line-height: 1.12; margin: 0 0 14px; letter-spacing: -.018em; }
.article h2 { font-size: clamp(25px, 2.5vw, 32px); line-height: 1.2; margin: 42px 0 14px; padding-top: 3px; }
.article h2::before { content: ""; display: block; width: 34px; height: 4px; background: var(--bc-yellow); margin-bottom: 12px; }
.article h3 { font-size: 21px; line-height: 1.3; margin: 25px 0 9px; }
.article p { max-width: 880px; margin: 0 0 16px; }
.article .lead { font-size: 16px; line-height: 1.55; color: #333; max-width: 950px; }
.placeholder {
  margin: 8px 0 0;
  max-width: 920px;
  color: #4a4a4a;
}
.placeholder strong { display: inline; color: inherit; }
.card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin: 22px 0 10px; }
.card { border: 1px solid var(--border); background: white; padding: 24px; box-shadow: 0 2px 5px rgba(0,0,0,.09); min-width: 0; }
.card h3 { margin: 0 0 9px; color: var(--bc-blue); }
.card p { margin-bottom: 18px; }
.path-card { border-top: 5px solid var(--bc-yellow); }
.path-label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.button-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 18px 0 0; }
.button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--bc-blue); padding: 9px 16px; border-radius: 2px; background: var(--bc-blue); color: white; text-decoration: none; font-weight: 700; cursor: pointer; }
.button:hover { background: var(--bc-blue-hover); color: white; }
.button.secondary { background: white; color: var(--bc-blue); }
.button.secondary:hover { background: var(--bc-blue-light); }
.button svg { width: 18px; height: 18px; }
.resource-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 18px; }
.resource-card { border: 1px solid var(--border); padding: 20px; background: white; }
.resource-card h2, .resource-card h3 { margin-top: 0; }
.resource-card h3 { color: var(--bc-navy); }
.resource-card .placeholder { margin-top: 10px; }
.accordion { border-top: 1px solid var(--border); margin-top: 22px; }
.accordion-item { border-bottom: 1px solid var(--border); }
.accordion-item summary { cursor: pointer; list-style: none; padding: 18px 44px 18px 4px; font-weight: 700; font-size: 19px; position: relative; color: var(--bc-navy); }
.accordion-item summary::-webkit-details-marker { display: none; }
.accordion-item summary::after { content: "+"; position: absolute; right: 12px; top: 14px; font-size: 28px; color: var(--bc-blue); font-weight: 400; }
.accordion-item[open] summary::after { content: "−"; }
.accordion-content { padding: 0 42px 20px 4px; }
.next-links { display: flex; flex-wrap: wrap; gap: 10px; }
.page-nav { display: flex; justify-content: space-between; gap: 18px; border-top: 1px solid var(--border); margin-top: 48px; padding-top: 24px; }
.page-nav a { display: flex; align-items: center; gap: 7px; font-weight: 700; text-decoration: none; max-width: 44%; }
.page-nav .next { margin-left: auto; text-align: right; }
.page-nav .prev svg { transform: rotate(180deg); }
.page-nav svg { width: 18px; height: 18px; flex: 0 0 18px; }
.toast { position: fixed; right: 24px; bottom: 24px; background: var(--bc-navy); color: white; padding: 12px 16px; box-shadow: var(--shadow); border-left: 5px solid var(--bc-yellow); opacity: 0; transform: translateY(16px); pointer-events: none; transition: .2s ease; z-index: 2000; max-width: 380px; }
.toast.show { opacity: 1; transform: translateY(0); }
.icon-button { border: 0; background: transparent; padding: 8px; display: inline-grid; place-items: center; cursor: pointer; }
.icon-button svg { width: 24px; height: 24px; }
.sidebar-scrim { display: none; }
@media (max-width: 1180px) { .docs-shell { grid-template-columns: 250px minmax(0,1fr); gap: 26px; padding-inline: 28px; } .article { padding: 32px; } }
@media (max-width: 900px) {
  :root { --sidebar: 286px; }
  .mobile-topbar { display: flex; position: sticky; top: 0; z-index: 900; height: 62px; background: var(--bc-navy); color: white; align-items: center; padding: 0 12px; gap: 12px; box-shadow: 0 2px 5px rgba(0,0,0,.2); }
  .mobile-wordmark { font-weight: 700; margin-left: auto; margin-right: 8px; }
  .mobile-topbar .icon-button { color: white; }
  .global-sidebar { transform: translateX(-101%); transition: transform .2s ease; width: var(--sidebar); }
  .global-sidebar.open { transform: translateX(0); }
  .sidebar-brand { min-height: 92px; }
  .sidebar-close { display: inline-grid; }
  .sidebar-scrim { display: block; position: fixed; inset: 0; z-index: 950; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .sidebar-scrim.open { opacity: 1; pointer-events: auto; }
  .app-shell { margin-left: 0; }
  .devhub-header { padding: 28px 22px; }
  .docs-shell { display: block; padding: 22px 18px 60px; }
  .local-nav-toggle { display: flex; width: 100%; align-items: center; justify-content: space-between; border: 1px solid var(--border); background: white; padding: 13px 14px; font-weight: 700; color: var(--bc-navy); margin-bottom: 14px; }
  .local-nav-toggle svg { width: 18px; height: 18px; transition: transform .2s; }
  .local-nav-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
  .local-nav { display: none; position: static; margin-bottom: 18px; max-height: none; }
  .local-nav.open { display: block; }
  .article { padding: 28px 24px 36px; }
}
@media (max-width: 650px) {
  body { font-size: 15px; }
  .devhub-title-row { gap: 12px; }
  .devhub-header { padding-inline: 16px; }
  .search-wrap { min-height: 52px; }
  .search-wrap button { padding-inline: 14px; }
  .article { padding: 24px 18px 32px; }
  .article h1 { font-size: 34px; }
  .article h2 { font-size: 26px; }
  .card-grid, .resource-grid { grid-template-columns: 1fr; }
  .page-nav { align-items: flex-start; }
  .page-nav a { max-width: 48%; }
}

.discovery-list {
  margin-top: 18px;
  max-width: 860px;
}
.discovery-resource {
  padding: 18px 0;
  border-top: 1px solid #d8d8d8;
}
.discovery-resource:first-child {
  border-top: 0;
  padding-top: 4px;
}
.discovery-resource h3 {
  margin: 0 0 6px;
  font-size: 20px;
  line-height: 1.3;
}
.discovery-resource p {
  margin: 0 0 7px;
  color: #4a4a4a;
}
.text-link {
  color: var(--bc-blue);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.text-link:hover {
  color: var(--bc-navy);
  text-decoration-thickness: 2px;
}


.document-link-section {
  padding-top: 10px;
}
.document-link {
  font-size: 16px;
}

.resource-text-link {
  margin: 10px 0 0;
}

.prototype-note { margin: 20px 0; padding: 16px 18px; border-left: 5px solid var(--bc-yellow); background: #fff8df; max-width: 920px; }
.prototype-note strong { color: var(--bc-navy); }
.info-callout { margin: 22px 0; padding: 18px 20px; border-left: 5px solid var(--bc-blue); background: var(--info-bg); max-width: 920px; }
.info-callout p:last-child, .prototype-note p:last-child { margin-bottom: 0; }
.topic-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; margin: 22px 0; max-width: 980px; }
.topic-card { border: 1px solid var(--border); border-top: 4px solid var(--bc-yellow); padding: 20px; background: white; }
.topic-card h3 { margin-top: 0; color: var(--bc-navy); }
.topic-card p:last-child { margin-bottom: 0; }
.text-action { display: inline-flex; align-items: center; gap: 6px; color: var(--bc-blue); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.text-action svg { width: 16px; height: 16px; }
.clean-list { max-width: 900px; padding-left: 24px; }
.clean-list li { margin: 6px 0; }
.check-list { list-style: none; padding-left: 0; max-width: 900px; }
.check-list li { position: relative; padding-left: 30px; margin: 9px 0; }
.check-list li::before { content: '✓'; position: absolute; left: 0; top: 0; color: var(--bc-blue); font-weight: 700; }
.route-options { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; margin: 20px 0; max-width: 980px; }
.route-card { border: 1px solid var(--border); padding: 22px; background: white; }
.route-card h3 { margin-top: 0; color: var(--bc-navy); }
.route-card .path-label { margin-bottom: 8px; }
.step-list { counter-reset: steps; list-style: none; padding: 0; max-width: 920px; }
.step-list > li { counter-increment: steps; position: relative; padding: 0 0 24px 54px; min-height: 48px; }
.step-list > li::before { content: counter(steps); position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--bc-navy); color: white; font-weight: 700; }
.step-list > li:not(:last-child)::after { content: ''; position: absolute; left: 16px; top: 38px; bottom: 4px; width: 2px; background: #c9d7e5; }
.step-list h3 { margin: 2px 0 6px; }
.process-strip { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 10px; margin: 22px 0; max-width: 980px; }
.process-step { border: 1px solid var(--border); border-top: 4px solid var(--bc-blue); padding: 14px; background: white; }
.process-step .n { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.process-step strong { display: block; color: var(--bc-navy); margin: 4px 0; }
.inline-links { display: flex; flex-wrap: wrap; gap: 12px 18px; margin: 14px 0 4px; }
.consumer-stacked-links { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin: 14px 0 4px; }
.muted { color: var(--muted); }
.criteria-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px 24px; max-width: 980px; padding-left: 20px; }
.assessment-criteria-list {
  display: block;
  max-width: 920px;
  margin: 18px 0 24px;
  padding: 20px 24px 20px 46px;
  border-left: 5px solid var(--bc-blue);
  background: var(--bc-blue-light);
}
.assessment-criteria-list li + li { margin-top: 10px; }
.support-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; margin: 20px 0; max-width: 980px; }
.support-grid-three { grid-template-columns: repeat(3,minmax(0,1fr)); }
.support-card { border: 1px solid var(--border); padding: 20px; background: white; }
.support-card h3 { margin-top: 0; color: var(--bc-navy); }
.article .subtle-label { margin: 0 0 6px; color: var(--muted); font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.article code { background: #f2f2f2; padding: 2px 5px; border-radius: 3px; }
@media (max-width: 760px) {
  .topic-grid, .route-options, .criteria-list, .support-grid, .support-grid-three { grid-template-columns: 1fr; }
  .process-strip { grid-template-columns: 1fr; }
}


/* Provider routing page improvements */
.provider-purpose {
  margin: 18px 0 24px;
  padding: 16px 18px;
  border-left: 5px solid var(--bc-blue);
  background: var(--info-bg);
  max-width: 920px;
  font-size: 18px;
  line-height: 1.45;
}
.provider-purpose strong { color: var(--bc-navy); }
.provider-step {
  max-width: 980px;
  margin: 0;
  padding: 26px 24px 24px;
  border-top: 1px solid var(--border);
  background: #fbfcfd;
}
.provider-step + .provider-step { margin-top: 14px; }
.provider-step h2 {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-top: 0;
  padding-top: 0;
}
.provider-step h2::before { display: none; }
.step-number {
  flex: 0 0 34px;
  width: 34px;
  height: 34px;
  border-radius: 50%;

  padding-left: 0;

  margin: 12px 0;
}
.decision-list li {
  position: relative;
  padding-left: 28px;
  margin: 8px 0;
}
.decision-list li::before {
  content: '→';
  position: absolute;
  left: 0;
  color: var(--bc-blue);
  font-weight: 700;
}

/* Provider decision path */
.publishing-decision-path {
  max-width: 920px;
  margin-top: 4px;
}
.publishing-question {
  margin: 0;
  padding: 24px 0 26px;
  border-top: 1px solid var(--border);
}
.publishing-question:first-child {
  border-top: 0;
  padding-top: 8px;
}
.publishing-question h2 {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin: 0 0 10px;
}
.publishing-question h2::before { display: none; }
.publishing-question > p,
.publishing-question > .check-list,
.publishing-question > .answer-paths {
  margin-left: 46px;
}
.answer-paths {
  margin-top: 18px;
  border-top: 1px solid var(--border);
}
.answer-path {
  display: grid;
  grid-template-columns: 145px minmax(0, 1fr);
  gap: 18px;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
}
.answer-label {
  display: inline-block;
  width: fit-content;
  padding: 5px 9px;
  border-radius: 2px;
  background: var(--bc-blue-light);
  color: var(--bc-navy);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.2;
}
.answer-copy p { margin: 0; }
.path-continue {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0 0 0 16px;
  padding: 10px 0 10px 30px;
  border-left: 2px solid var(--bc-blue);
  color: var(--bc-navy);
  font-size: 15px;
  font-weight: 700;
}
.path-continue::before {

  color: var(--bc-blue);
  font-size: 18px;

.publishing-question .check-list { margin-bottom: 6px; }
@media (max-width: 620px) {
  .publishing-question > p,
  .publishing-question > .check-list,
  .publishing-question > .answer-paths { margin-left: 0; }
  .answer-path { grid-template-columns: 1fr; gap: 7px; }
  .path-continue { margin-left: 10px; padding-left: 18px; }
}

.provider-guidance-links { margin-top: 16px; }
.provider-check-list li { margin: 12px 0; }
.provider-note { margin-top: 14px; margin-bottom: 0; color: #3f3f3f; }
.provider-next {
  max-width: 980px;
  margin-top: 24px;
  padding-top: 6px;
}
.provider-decision-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin: 18px 0 8px;
  max-width: 980px;
}
.decision-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  min-height: 100%;
  border-top: 4px solid var(--bc-yellow);
}
.decision-card h3 { margin: 7px 0 8px; }
.decision-card p { flex: 1; margin-bottom: 18px; }
.decision-order {
  width: 27px;
  height: 27px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--bc-blue-light);
  color: var(--bc-navy);
  font-weight: 700;
  font-size: 14px;
}
.decision-action {
  width: 100%;
  justify-content: space-between;
  text-align: left;
}
.provider-learn-more {
  max-width: 980px;
  margin-top: 26px;
  padding: 20px 22px;
  border: 1px solid var(--border);
  background: #f7f7f7;
}
.provider-learn-more h2 { margin-top: 0; font-size: 24px; }
.provider-learn-more h2::before { display: none; }
.provider-page-nav a {
  min-height: 52px;
  padding: 11px 14px;
  border: 1px solid #b7c3cf;
  border-radius: 3px;
  background: white;
  color: var(--bc-blue);
}
.provider-page-nav a:hover { background: var(--bc-blue-light); color: var(--bc-navy); }
.provider-page-nav .nav-context { display: block; font-size: 14px; color: var(--muted); font-weight: 400; margin-bottom: 1px; }
.provider-page-nav .nav-title { display: block; }

.provider-intro {
  max-width: 900px;
  margin: -8px 0 24px;
  color: #333;
}
.provider-radio-options {
  border: 0;
  padding: 0;
  margin: 14px 0 10px;
  max-width: 880px;
}
.provider-radio-option {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 10px 12px;
  margin: 7px 0;
  border: 1px solid #d8d8d8;
  border-radius: 3px;
  background: white;
  cursor: pointer;
}
.provider-radio-option:hover { background: var(--bc-blue-light); }
.provider-radio-option input {
  margin: 4px 0 0;
  width: 18px;
  height: 18px;
  accent-color: var(--bc-blue);
  flex: 0 0 auto;
}
.provider-radio-option:has(input:checked) {
  border-color: var(--bc-blue);
  background: var(--info-bg);
}
.provider-decision-grid .decision-card { min-height: 180px; }
.provider-decision-grid .decision-card h3 { flex: 1; }
.provider-secondary-action { width: auto; min-width: 250px; }
.provider-after {
  max-width: 980px;
  margin-top: 26px;
  padding-top: 8px;
}
.provider-after-links { margin-top: 12px; }



@media (max-width: 1050px) {
  .provider-decision-grid { grid-template-columns: 1fr; }
}
@media (max-width: 650px) {
  .provider-step { padding: 22px 16px 20px; }
  .provider-step h2 { gap: 10px; }
  .step-number { flex-basis: 30px; width: 30px; height: 30px; }
  .provider-purpose { font-size: 16px; }
}


.supporting-materials-list .discovery-resource {
  border-top: 0;
  padding: 7px 0;
}
.supporting-materials-list .discovery-resource:first-child {
  padding-top: 4px;
}

</style>
</head>

<script>
const PAGES = {
  "all-data": {
    "title": "About data",
    "nav": "About data",
    "group": "Connected Services",
    "intro": "Connected Services helps B.C. government teams find, understand, publish, and reuse data. Data can be described in different ways depending on its value, its role, and how it is managed.",
    "body": "\n      <section>\n        <h2>How data is classified and managed</h2>\n        <div class=\"topic-grid\">\n          <div class=\"topic-card\"><h3>High-value data</h3><p>High-value data is data that holds significant value and is worth sharing.</p><a class=\"text-action\" href=\"#high-value\" data-page=\"high-value\">Learn more<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"topic-card\"><h3>Authoritative data</h3><p>Authoritative data is the designated source of truth for a specific subject.</p><a class=\"text-action\" href=\"#authoritative\" data-page=\"authoritative\">Learn more<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"topic-card\"><h3>Data registers</h3><p>A data register is a standardized way to manage and share authoritative data.</p><a class=\"text-action\" href=\"#data-registers\" data-page=\"data-registers\">Learn more<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"topic-card\"><h3>Other data</h3><p>Data does not need to be high value or authoritative to be useful. Other datasets can still be published and shared through standard processes.</p><a class=\"text-action\" href=\"#standard-publishing\" data-page=\"standard-publishing\">Learn more<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n        </div>\n      </section>\n      <section>\n        <h2>What do you want to do?</h2>\n        <div class=\"route-options\">\n          <div class=\"route-card\"><div class=\"path-label\">Provider path</div><h3>Provide data</h3><p>Choose the right publishing or authoritative data path based on the data you manage.</p><a class=\"text-action\" href=\"#provider\" data-page=\"provider\">Get started<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"route-card\"><div class=\"path-label\">Consumer path</div><h3>Find datasets and APIs</h3><p>Search for datasets or APIs, understand what they mean, decide whether they fit your needs, and connect to them.</p><a class=\"text-action\" href=\"#consumer\" data-page=\"consumer\">Find datasets and APIs<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n        </div>\n      </section>"
  },
  "consumer": {
    "title": "Find datasets and APIs",
    "nav": "Find datasets and APIs",
    "group": "Consumer path",
    "intro": "Use this page if you are looking for datasets or APIs for a government service, product, analysis, or integration. This page helps you find available datasets and APIs, check if they fit your needs, understand their definitions, and connect to them. If a dataset has been designated as authoritative, an Authoritative label will appear on its page.",
    "body": "\n      <section>\n        <h2>Search for datasets and APIs</h2>\n        <div class=\"prototype-note\"><p><strong>Future state:</strong> Connected Services / ITK will allow users to search across available datasets and APIs. Dataset pages will provide information to help users evaluate the data, and datasets designated as authoritative will display an <strong>Authoritative</strong> label. Until this is available, link to the current approved discovery tools.</p></div>\n        <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Search available datasets and APIs\">Search available datasets and APIs<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Evaluate and understand the data</h2>\n        <p>Different teams and systems may use different names for the same concept. Shared semantics create common definitions and reusable concepts so people and systems understand data in the same way. This shared meaning reduces confusion and makes data easier to find, integrate, and reuse.</p>\n        <p>Authoritative does not mean “right for every use.” Check the context to understand what the data is authoritative for. If the dataset has an <strong>Authoritative</strong> label, confirm what it is authoritative for and whether that purpose and scope match your intended use.</p>\n        <p>Review:</p>\n        <ul class=\"clean-list\"><li>Purpose and scope</li><li>Source and custodian</li><li>Coverage</li><li>Freshness</li><li>Quality and limitations</li><li>Definitions and business rules</li><li>How the data changes</li><li>Access or reuse conditions</li></ul>\n      </section>\n      <section>\n        <h2>After you connect</h2>\n        <p>After you connect, monitor changes to any dataset or API that your service, product or analysis relies on.</p>\n      </section>\n      <section>\n        <h2>When your setup is complete</h2>\n        <p>Your initial setup is complete when you have:</p>\n        <ul class=\"check-list\"><li>Confirmed that the data fits your needs</li><li>Understood the important definitions and limitations</li><li>Connected through the approved access process</li><li>Identified how your team will monitor important changes</li></ul>\n        <p>Monitoring continues for as long as your service or product relies on the data.</p>\n      </section>",
    "label": "Consumer routing page"
  },
  "provider": {
    "title": "Provide data",
    "nav": "Provide data",
    "group": "Provider path",
    "label": "Provider routing page",
    "intro": "Use this page if your team maintains a dataset that needs to be published or made available through Connected Services.",
    "body": "\n      <section class=\"provider-step\">\n        <h2><span class=\"step-number\">1</span>Is your data high value?</h2>\n        <p>Start by determining whether your dataset is considered high value.</p>\n        <ul class=\"decision-list\">\n          <li><strong>Yes</strong> \u2014 Continue to the next question.</li>\n          <li><strong>No</strong> \u2014 Your dataset can follow the <a class=\"text-action\" href=\"#standard-publishing\" data-page=\"standard-publishing\">standard data publishing process<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></li>\n          <li><strong>Not sure</strong> \u2014 <a class=\"text-action\" href=\"#high-value\" data-page=\"high-value\">Learn about high-value data<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></li>\n        </ul>\n      </section>\n      <section class=\"provider-step\">\n        <h2><span class=\"step-number\">2</span>Could your high-value data be authoritative?</h2>\n        <p>If your data is high value, check whether it might be a potential authoritative-data candidate. A dataset may be ready for an initial conversation when the following are understood:</p>\n        <ul class=\"check-list\"><li>Clear purpose and scope</li><li>Known source and data custodian</li><li>A government program or service relies on the data</li><li>Other teams may reuse it</li><li>Definitions, quality and limitations can be documented</li></ul>\n        <p>These conditions do not guarantee designation. They indicate that the dataset may be ready to be assessed.</p>\n        <div class=\"support-grid\"><div class=\"support-card\"><h3>Yes, it meets these criteria</h3><a class=\"text-action\" href=\"#designation\" data-page=\"designation\">Review the Authoritative Data Designation Process<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div><div class=\"support-card\"><h3>No, it does not meet these criteria</h3><a class=\"text-action\" href=\"#high-value\" data-page=\"high-value\">Follow high-value data guidance<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div></div>\n      </section>\n      <section>\n        <h2>Still not sure?</h2>\n        <p>If you are not sure which path applies, contact us for help choosing the correct next step.</p>\n        <p><a class=\"text-action\" href=\"#help\" data-page=\"help\">Contact us about your data<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>"
  },
