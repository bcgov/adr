/* Connected Services classification model */
.classification-model {
  display: grid;
  grid-template-columns: minmax(220px, 0.8fr) minmax(320px, 1.35fr);
  gap: 26px;
  max-width: 980px;
  margin: 24px 0 28px;
  align-items: start;
}
.classification-branch,
.classification-main { display: flex; flex-direction: column; align-items: stretch; }
.classification-node { border: 1px solid var(--border); border-left: 5px solid var(--bc-blue); background: #fff; padding: 16px 18px; }
.classification-node strong { display: block; color: var(--bc-navy); font-size: 18px; margin-bottom: 4px; }
.classification-branch .classification-node { border-left-color: var(--bc-yellow); }
.classification-connector { display: grid; place-items: center; min-height: 52px; color: var(--muted); font-size: 14px; font-weight: 700; text-align: center; position: relative; }
.classification-connector::before { content: ''; position: absolute; top: 4px; bottom: 20px; width: 2px; background: #b8c6d3; }
.classification-connector::after { content: '↓'; position: absolute; bottom: -1px; color: var(--bc-blue); font-size: 21px; line-height: 1; }
.classification-connector span { position: relative; z-index: 1; background: var(--bg); padding: 3px 8px; }
.classification-branch-label { color: var(--muted); font-size: 14px; font-weight: 700; margin: 0 0 8px; }
.concept-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; max-width: 980px; margin: 20px 0 28px; }
.concept-card { border: 1px solid var(--border); padding: 20px; background: white; }
.concept-card h3 { margin-top: 0; color: var(--bc-navy); }
.concept-card p:last-child { margin-bottom: 0; }
@media (max-width: 760px) { .classification-model, .concept-grid { grid-template-columns: 1fr; } }


/* Classify and manage data: progressive orientation */

}
.classification-row p { margin: 0 0 12px; }
.classification-row .text-action { display: inline-flex; }
.classification-linkage {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 42px;
  margin-left: 30px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
}
.classification-linkage::before {
  content: '↓';
  color: var(--bc-blue);
  font-size: 21px;
  line-height: 1;
}
.classification-alternate {
  margin-top: 26px;
  padding-top: 22px;
  border-top: 1px solid var(--border);
}
.classification-alternate .subtle-label { margin-bottom: 10px; }
.classification-row.alt {
  border-left-color: var(--bc-blue);
  background: #fff;
}
.semantic-bridge {
  max-width: 980px;
  padding: 24px 26px;
  border-left: 5px solid var(--bc-blue);
  background: var(--bc-blue-light);
}
.semantic-bridge h2 {
  margin-top: 0;
  padding-top: 0;
}
.semantic-bridge h2::before { display: none; }
.semantic-bridge p:last-child { margin-bottom: 0; }
.journey-handoff {
  max-width: 980px;
  padding: 24px 26px;
  border: 1px solid var(--border);
  background: #fff;
}
.journey-handoff h2 {
  margin-top: 0;
  padding-top: 0;
}
.journey-handoff h2::before { display: none; }
@media (max-width: 760px) {
  .classification-row { grid-template-columns: 1fr; gap: 14px; }
  .classification-row .text-action { white-space: normal; }
  .classification-linkage { margin-left: 14px; }
}

/* Provider routing page improvements */
.provider-purpose {
  margin: 18px 0 24px;
  padding: 16px 18px;
  border-left: 5px solid var(--bc-blue);
  background: var(--info-bg);
  max-width: 920px;
  font-size: 18px;
  line-height: 1.45;
}
.provider-purpose strong { color: var(--bc-navy); }
.provider-step {
  max-width: 980px;
  margin: 0;
  padding: 26px 24px 24px;
  border-top: 1px solid var(--border);
  background: #fbfcfd;
}
.provider-step + .provider-step { margin-top: 14px; }
.provider-step h2 {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-top: 0;
  padding-top: 0;
}
.provider-step h2::before { display: none; }
.step-number {
  flex: 0 0 34px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  background: var(--bc-navy);
  color: white;
  font-size: 16px;
  line-height: 1;
  margin-top: -1px;
}
.decision-list {
  list-style: none;
  padding-left: 0;
  max-width: 900px;
  margin: 12px 0;
}
.decision-list li {
  position: relative;
  padding-left: 28px;
  margin: 8px 0;
}
.decision-list li::before {
  content: '→';
  position: absolute;
  left: 0;
  color: var(--bc-blue);
  font-weight: 700;
}

/* Provider decision path */
.publishing-decision-path {
  max-width: 920px;
  margin-top: 4px;
}
.publishing-question {
  margin: 0;
  padding: 24px 0 26px;
  border-top: 1px solid var(--border);
}
.publishing-question:first-child {
  border-top: 0;
  padding-top: 8px;
}
.publishing-question h2 {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin: 0 0 10px;
}
.publishing-question h2::before { display: none; }
.publishing-question > p,
.publishing-question > .check-list,
.publishing-question > .answer-paths {
  margin-left: 46px;
}
.answer-paths {
  margin-top: 18px;
  border-top: 1px solid var(--border);
}
.answer-path {
  display: grid;
  grid-template-columns: 145px minmax(0, 1fr);
  gap: 18px;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
}
.answer-label {
  display: inline-block;
  width: fit-content;
  padding: 5px 9px;
  border-radius: 2px;
  background: var(--bc-blue-light);
  color: var(--bc-navy);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.2;
}
.answer-copy p { margin: 0; }
.path-continue {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0 0 0 16px;
  padding: 10px 0 10px 30px;
  border-left: 2px solid var(--bc-blue);
  color: var(--bc-navy);
  font-size: 15px;
  font-weight: 700;
}
.path-continue::before {
  content: '↓';
  color: var(--bc-blue);
  font-size: 18px;
  line-height: 1;
}
.publishing-question .check-list { margin-bottom: 6px; }
@media (max-width: 620px) {
  .publishing-question > p,
  .publishing-question > .check-list,
  .publishing-question > .answer-paths { margin-left: 0; }
  .answer-path { grid-template-columns: 1fr; gap: 7px; }
  .path-continue { margin-left: 10px; padding-left: 18px; }
}

.provider-guidance-links { margin-top: 16px; }
.provider-check-list li { margin: 12px 0; }
.provider-note { margin-top: 14px; margin-bottom: 0; color: #3f3f3f; }
.provider-next {
  max-width: 980px;
  margin-top: 24px;
  padding-top: 6px;
}
.provider-decision-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin: 18px 0 8px;
  max-width: 980px;
}
.decision-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  min-height: 100%;
  border-top: 4px solid var(--bc-yellow);
}
.decision-card h3 { margin: 7px 0 8px; }
.decision-card p { flex: 1; margin-bottom: 18px; }
.decision-order {
  width: 27px;
  height: 27px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--bc-blue-light);
  color: var(--bc-navy);
  font-weight: 700;
  font-size: 14px;
}
.decision-action {
  width: 100%;
  justify-content: space-between;
  text-align: left;
}
.provider-learn-more {
  max-width: 980px;
  margin-top: 26px;
  padding: 20px 22px;
  border: 1px solid var(--border);
  background: #f7f7f7;
}
.provider-learn-more h2 { margin-top: 0; font-size: 24px; }
.provider-learn-more h2::before { display: none; }
.provider-page-nav a {
  min-height: 52px;
  padding: 11px 14px;
  border: 1px solid #b7c3cf;
  border-radius: 3px;
  background: white;
  color: var(--bc-blue);
}
.provider-page-nav a:hover { background: var(--bc-blue-light); color: var(--bc-navy); }
.provider-page-nav .nav-context { display: block; font-size: 14px; color: var(--muted); font-weight: 400; margin-bottom: 1px; }
.provider-page-nav .nav-title { display: block; }

.provider-intro {
  max-width: 900px;
  margin: -8px 0 24px;
  color: #333;
}
.provider-radio-options {
  border: 0;
  padding: 0;
  margin: 14px 0 10px;
  max-width: 880px;
}
.provider-radio-option {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 10px 12px;
  margin: 7px 0;
  border: 1px solid #d8d8d8;
  border-radius: 3px;
  background: white;
  cursor: pointer;
}
.provider-radio-option:hover { background: var(--bc-blue-light); }
.provider-radio-option input {
  margin: 4px 0 0;
  width: 18px;
  height: 18px;
  accent-color: var(--bc-blue);
  flex: 0 0 auto;
}
.provider-radio-option:has(input:checked) {
  border-color: var(--bc-blue);
  background: var(--info-bg);
}
.provider-decision-grid .decision-card { min-height: 180px; }
.provider-decision-grid .decision-card h3 { flex: 1; }
.provider-secondary-action { width: auto; min-width: 250px; }
.provider-after {
  max-width: 980px;
  margin-top: 26px;
  padding-top: 8px;
}
.provider-after-links { margin-top: 12px; }



@media (max-width: 1050px) {
  .provider-decision-grid { grid-template-columns: 1fr; }
}
@media (max-width: 650px) {
  .provider-step { padding: 22px 16px 20px; }
  .provider-step h2 { gap: 10px; }
  .step-number { flex-basis: 30px; width: 30px; height: 30px; }
  .provider-purpose { font-size: 16px; }
}


.supporting-materials-list .discovery-resource {
  border-top: 0;
  padding: 7px 0;
}
.supporting-materials-list .discovery-resource:first-child {
  padding-top: 4px;
}

/* In-page table of contents */
.designation-fast-track {
  max-width: 920px;
  margin: 18px 0 2px;
  padding: 12px 14px;
  background: #f8fafc;
  border-left: 4px solid var(--bc-yellow);
}
.designation-fast-track p { margin: 0; }

.on-this-page {
  max-width: 920px;
  margin: 30px 0 38px;
}
.on-this-page h2 {
  margin-top: 0;
}
.on-this-page ul {
  margin: 14px 0 0;
  padding-left: 26px;
}
.on-this-page li {
  margin: 9px 0;
}
.on-this-page a {
  color: var(--bc-blue);
  text-underline-offset: 2px;
}
.article section[id] {
  scroll-margin-top: 24px;
}

<script>
const PAGES = {
  "all-data": {
    "title": "Get started with data",
    "nav": "Get started with data",
    "group": "Connected Services",
    "intro": "",
    "body": "\n      <section>\n        <div class=\"prototype-note\">\n          <p><strong>Placeholder: Temporary audience-routing page</strong></p>\n          <p>For now its purpose is to split users by intent. Long term, this page will change because the wider ITK experience should already know which path the person is on before they reach this ADR content.</p>\n        </div>\n        <p class=\"lead\">Choose the path that best matches how you work with data.</p>\n        <div class=\"route-options\">\n          <div class=\"route-card\"><div class=\"path-label\">Provider path</div><h3>Provide data</h3><p>Determine what requirements and guidance apply to the data you want to provide.</p><a class=\"text-action\" href=\"#provider\" data-page=\"provider\">Get started<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"route-card\"><div class=\"path-label\">Consumer path</div><h3>Find and use data</h3><p>Find data, understand what it means, and determine whether it fits your needs.</p><a class=\"text-action\" href=\"#consumer\" data-page=\"consumer\">Find and use data<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n        </div>\n      </section>"
  },
  "consumer": {
    "title": "Find and use datasets",
    "nav": "Find and use datasets",
    "group": "Consumer path",
    "intro": "",
    "body": "\n      <section>\n        <p class=\"lead\">Use this guidance when using data through Connected Services to understand what the data represents and determine whether it is appropriate for your needs.</p>\n      </section>\n      <section>\n        <h2>Search for datasets and APIs</h2>\n        <div class=\"prototype-note\"><p><strong>Placeholder:</strong> link to the current approved discovery tools.</p></div>\n        <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Search available datasets and APIs\">Search available datasets and APIs<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Understand how data is classified</h2>\n        <p>Connected Services uses classifications to provide context about the role and status of data.</p>\n        <div class=\"classification-list\">\n          <div class=\"classification-row\">\n            <h3>High-value data</h3>\n            <p>High-value data is data that has been identified as holding significant value and being worth sharing across government. Being high value does not necessarily mean the data is authoritative.</p>\n            <a class=\"text-action\" href=\"#high-value\" data-page=\"high-value\">Learn about high-value data<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a>\n          </div>\n          <div class=\"classification-row\">\n            <h3>Authoritative data</h3>\n            <p>Authoritative data is data that has been formally designated as the trusted source for a defined purpose and scope. A dataset must first be considered high-value before it can be considered for authoritative designation.</p>\n            <a class=\"text-action\" href=\"#authoritative\" data-page=\"authoritative\">Learn about authoritative data<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a>\n          </div>\n          <div class=\"classification-row alt\">\n            <h3>Other data</h3>\n            <p>Not all data is identified as high-value or designated authoritative. Other data may include operational data that supports programs and services, as well as published datasets that are available for reuse.</p>\n            <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Learn about published datasets — destination TBD\">Learn about published datasets<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n          </div>\n        </div>\n      </section>\n      <section>\n        <h2>Understand what the data means</h2>\n        <p>Classification tells you about the <strong>role and status of the data</strong>. Semantics helps you understand <strong>what the data means</strong>. Connected Services supports shared meaning through resources such as:</p>\n        <div class=\"support-grid\">\n          <div class=\"support-card\">\n            <h3>Connected Services Data Glossary</h3>\n            <p>Use the Data Glossary to understand shared concepts and terminology used across Connected Services.</p>\n            <a class=\"text-action\" href=\"#glossary\" data-page=\"glossary\">Learn about the Data Glossary<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a>\n          </div>\n          <div class=\"support-card\">\n            <h3>Data dictionaries</h3>\n            <p>Use available data dictionary information to understand the meaning, structure and characteristics of individual fields within a dataset.</p>\n            <a class=\"text-action\" href=\"#data-dictionary\" data-page=\"data-dictionary\">Learn about data dictionaries<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a>\n          </div>\n        </div>\n      </section>\n      <section>\n        <h2>Evaluate whether the data fits your needs</h2>\n        <p>Before relying on a dataset, review:</p>\n        <ul class=\"clean-list\">\n          <li><strong>Purpose and scope:</strong> What is the dataset intended to represent or support?</li>\n          <li><strong>Authoritative scope:</strong> If it is authoritative, what specifically has been designated as trusted?</li>\n          <li><strong>Source and custodian:</strong> Where does the data come from and who is responsible for it?</li>\n          <li><strong>Coverage:</strong> Does it contain the population, subject matter or time period you need?</li>\n          <li><strong>Freshness:</strong> How often is the data updated, and is it current enough for your use?</li>\n          <li><strong>Quality and limitations:</strong> Are there known gaps, quality issues or conditions you need to account for?</li>\n          <li><strong>Definitions and business rules:</strong> Do you understand what the data and its fields mean?</li>\n          <li><strong>Changes over time:</strong> Could changes to the dataset affect how you use it?</li>\n          <li><strong>Access and reuse conditions:</strong> Are there privacy, security, legal or policy requirements that affect your use?</li>\n        </ul>\n        <p>A dataset being authoritative or high value can provide useful context, but it does not replace the need to assess whether the data fits your specific purpose.</p>\n      </section>\n      <section>\n        <h2>After you start using the data</h2>\n        <p>Once your service, product or analysis relies on a dataset, continue to monitor changes that could affect how you use it.</p>\n        <p>You may need to:</p>\n        <ul class=\"clean-list\">\n          <li>Keep track of changes to the dataset, definitions or authoritative scope</li>\n          <li>Review updated documentation and known limitations</li>\n          <li>Understand how changes to the source may affect your use</li>\n          <li>Confirm that the data continues to meet your business need</li>\n          <li>Update your own documentation when your use of the data changes</li>\n        </ul>\n      </section>\n      <section>\n        <h2>Contact us</h2>\n        <p>Submit feedback, request more information, or get help through the <a class=\"text-action\" href=\"#\" data-placeholder-action=\"Shared TechDocs Help/Contact page — destination TBD\">placeholder link<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a>.</p>\n      </section>",
    "label": "Consumer routing page"
  },
  "provider": {
    "title": "Provide data",
    "nav": "Provide data",
    "group": "Provider path",
    "label": "Provider path",
    "intro": "",
    "body": "\n      <p class=\"lead\">If your team maintains a dataset that needs to be published or made available through Connected Services, start by determining which classification or path applies to your data.</p>\n      <div class=\"info-callout\">\n        <p><strong>Not sure how your data is classified?</strong></p>\n        <p>Learn how high-value, authoritative and other data relate before you continue.</p>\n        <p><a class=\"text-action\" href=\"#classify-manage\" data-page=\"classify-manage\">Learn how data is classified<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </div>\n      <section class=\"provider-step\">\n        <h2>Step 1: Is your data high value?</h2>\n        <p>Start by determining whether your dataset is considered high value.</p>\n        <div class=\"support-grid support-grid-three\">\n          <div class=\"support-card\"><h3>Yes</h3><p>Continue to the next step.</p></div>\n          <div class=\"support-card\"><h3>No</h3><p>Your dataset can follow the standard publishing process.</p><a class=\"text-action\" href=\"#standard-publishing\" data-page=\"standard-publishing\">Follow standard data publishing<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"support-card\"><h3>Not sure</h3><p>Review the high-value data guidance to determine whether your dataset qualifies.</p><a class=\"text-action\" href=\"#high-value\" data-page=\"high-value\">Learn about high-value data<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n        </div>\n      </section>\n      <section class=\"provider-step\">\n        <h2>Step 2: Could your high-value data be authoritative?</h2>\n        <p>If your data is high value, consider whether it may be a candidate for authoritative designation.</p>\n        <p>Your dataset may be ready for an initial conversation when:</p>\n        <ul class=\"check-list\"><li>Its purpose and proposed authoritative scope are clear</li><li>Its source and authority can be verified</li><li>A responsible data custodian is identified</li><li>It can be made available in a machine-readable form</li><li>Sufficient metadata and definitions can be provided</li><li>Relevant security, privacy and Indigenous data considerations can be identified and addressed</li></ul>\n        <p>These conditions do not guarantee designation. They indicate that the dataset may be ready to be assessed.</p>\n        <div class=\"support-grid\">\n          <div class=\"support-card\"><h3>Yes, it may be authoritative</h3><a class=\"text-action\" href=\"#authoritative\" data-page=\"authoritative\">Learn what authoritative data means<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"support-card\"><h3>No, it does not meet these criteria</h3><a class=\"text-action\" href=\"#high-value\" data-page=\"high-value\">Continue with high-value data guidance<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n        </div>\n      </section>\n      <section>\n        <h2>Contact us</h2>\n        <p>Submit feedback, request more information, or get help through the <a class=\"text-action\" href=\"#\" data-placeholder-action=\"Shared TechDocs Help/Contact page — destination TBD\">placeholder link<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a>.</p>\n      </section>"
  },
  "classify-manage": {
    "title": "How data is classified",
    "nav": "How data is classified",
    "group": "Provide data",
    "intro": "Connected Services uses data classification and designation status to help determine which guidance, requirements and processes may apply to your data. Start by understanding whether your data is high value, may be authoritative, or follows another publishing path.",
    "body": "\n      <section>\n        <div class=\"classification-list\">\n          <div class=\"classification-row\">\n            <h3>High-value data</h3><p>High-value data is data that holds significant value and is worth sharing across government. Being identified as high value may affect the guidance and requirements that apply when the data is provided through Connected Services.</p>\n            <a class=\"text-action\" href=\"#high-value\" data-page=\"high-value\">Learn about high-value data<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a>\n          </div>\n          <div class=\"classification-row\">\n            <h3>Authoritative data</h3><p>Authoritative data is data that has been formally designated as the trusted source for a defined purpose and scope. A dataset must first be considered high-value before it can be considered for authoritative designation.</p>\n            <a class=\"text-action\" href=\"#authoritative\" data-page=\"authoritative\">Learn about authoritative data<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a>\n          </div>\n          <div class=\"classification-row alt\">\n            <h3>Other data</h3><p>Other data may include operational data that supports programs and services, as well as published datasets that are available for reuse without being identified as high value or designated authoritative.</p>\n            <a class=\"text-action\" href=\"#standard-publishing\" data-page=\"standard-publishing\">Learn about publishing data<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a>\n          </div>\n        </div>\n      </section>\n      <section>\n        <h2>Data registers</h2>\n        <p>Authoritative data may also be managed as a data register when it needs to be consistently maintained, shared or reused across services.</p>\n        <p>Not every authoritative dataset needs to be a data register.</p>\n        <p><a class=\"text-action\" href=\"#data-registers\" data-page=\"data-registers\">Learn about data registers<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Semantics</h2>\n        <p>Classification helps determine what role your data plays and which guidance or requirements apply. Semantics helps people and systems understand what the data means. Shared definitions and field-level documentation help make authoritative scope, classification and reuse clearer and more consistent.</p>\n        <p>Connected Services supports shared meaning through:</p>\n        <div class=\"support-grid\">\n          <div class=\"support-card\"><h3>Data dictionaries</h3><p>Document the business and technical information needed to understand individual fields in a dataset or API.</p><a class=\"text-action\" href=\"#data-dictionary\" data-page=\"data-dictionary\">Learn more<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"support-card\"><h3>Connected Services Data Glossary</h3><p>Provides shared definitions and terminology so concepts can be interpreted consistently across teams, systems and services.</p><a class=\"text-action\" href=\"#glossary\" data-page=\"glossary\">Learn more<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n        </div>\n        <p><a class=\"text-action\" href=\"#semantics\" data-page=\"semantics\">Learn about semantics<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section class=\"journey-handoff\">\n        <h2>Ready to begin?</h2>\n        <p>Continue to the provider guidance to determine your next steps.</p>\n        <p><a class=\"button\" href=\"#provider\" data-page=\"provider\">Get started<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n"
  },

  "authoritative": {
    "title": "Authoritative data",
    "nav": "Authoritative data",
    "group": "Provider path",
    "intro": "Authoritative data is data that has been formally designated as the trusted source for a defined purpose and scope. Using authoritative data helps people and systems know which source should be relied on when the same or similar information exists in multiple places.",
    "body": "\n      <section>\n        <h2>Why trusted data matters</h2>\n        <p>Authoritative data helps reduce uncertainty about which information should be used and supports more consistent reuse across government.</p>\n        <div class=\"support-grid\">\n          <div class=\"support-card\"><h3>Without trusted data</h3><ul class=\"clean-list\"><li>Multiple versions of the same information</li><li>Duplicate collection and maintenance</li><li>Lower confidence in analysis and decision-making</li><li>Difficulty connecting and reusing data across services</li></ul></div>\n          <div class=\"support-card\"><h3>With trusted data</h3><ul class=\"clean-list\"><li>Clear accountability for the data</li><li>A trusted source for a defined purpose</li><li>Greater confidence when data is shared or reused</li><li>More consistent use of data across services and systems</li></ul></div>\n        </div>\n      </section>\n      <section>\n        <h2>When authoritative data may apply</h2>\n        <p>A high-value dataset may be a potential candidate for authoritative designation when:</p>\n        <ul class=\"clean-list\"><li>Its purpose and proposed authoritative scope are clear</li><li>Its source and authority can be verified</li><li>A responsible data custodian is identified</li><li>It can be made available in a machine-readable form</li><li>Sufficient metadata and definitions can be provided</li><li>Relevant security, privacy and Indigenous data considerations can be identified and addressed</li></ul>\n        <p>Authoritative designation applies to a defined purpose and scope. It does not mean that a dataset is the authoritative source for every possible use of the information it contains.</p>\n      </section>\n      <section>\n        <h2>Think your dataset may be authoritative?</h2>\n        <p>If your dataset may be the trusted source for a defined purpose, review the Authoritative Data Designation Process to understand the assessment criteria, what your team needs to prepare, and what happens before and after designation.</p>\n        <p><a class=\"text-action\" href=\"#designation\" data-page=\"designation\">Review Authoritative Data Designation Guidance<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Contact us</h2>\n        <p>Submit feedback, request more information, or get help through the <a class=\"text-action\" href=\"#\" data-placeholder-action=\"Shared TechDocs Help/Contact page — destination TBD\">placeholder link<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a>.</p>\n      </section>"
  },
  "designation": {
    "title": "Authoritative Data Designation",
    "nav": "Authoritative Data Designation",
    "group": "Authoritative data",
    "intro": "The purpose of the Authoritative Data Designation Process (ADDP) is to create confidence in which data source government should trust and reuse. It provides clear accountability, consistent assessment, government-wide recognition, and improved discoverability. The outcome is “Trusted data” that ministries and programs can rely on.",
    "body": "\n      <div class=\"designation-fast-track\"><p><strong>Already familiar with the designation process?</strong> <a class=\"text-action\" href=\"#designation-ready\">Jump to Ready to begin<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p></div>\n      <nav class=\"on-this-page\" aria-labelledby=\"designation-on-this-page\">\n        <h2 id=\"designation-on-this-page\">On this page</h2>\n        <ul>\n          <li><a href=\"#designation-meaning\">What authoritative designation means</a></li>\n          <li><a href=\"#designation-assessment-criteria\">Assessment criteria</a></li>\n          <li><a href=\"#designation-process\">How the authoritative designation process works</a></li>\n          <li><a href=\"#designation-roles\">Roles and responsibilities</a></li>\n          <li><a href=\"#designation-escalation\">When escalation may be required</a></li>\n          <li><a href=\"#manage-after-designation\">What happens after designation</a></li>\n          <li><a href=\"#designation-ready\">Ready to begin?</a></li>\n          <li><a href=\"#designation-contact\">Contact us</a></li>\n        </ul>\n      </nav>\n      <section id=\"designation-meaning\">\n        <h2>What authoritative designation means</h2>\n        <p>An authoritative designation is the formal recognition of a dataset as the <strong>official and trusted source of truth</strong> for a specific subject area within government. It confirms that the dataset has been assessed against the <strong>Assessment criteria</strong>, supports clear accountability, and can be confidently reused as a trusted source of data.</p>\n        <p>Designation does not guarantee:</p>\n        <ul class=\"clean-list\"><li>High data quality or freedom from errors</li><li>Completeness, accuracy, or suitability for every use case</li><li>Unrestricted access, use, or sharing</li><li>Exemption from privacy, legal, policy, or security requirements</li></ul>\n        <p>Known limitations, data quality issues, and conditions of use should be documented so users understand how the dataset can—and cannot—be relied upon.</p>\n      </section>\n      <section id=\"designation-assessment-criteria\">\n        <h2>Assessment criteria</h2>\n        <p>A candidate dataset is assessed against the following criteria to determine whether it can be formally recognized as authoritative:</p>\n        <ul class=\"assessment-criteria-list\">\n          <li><strong>Clear purpose:</strong> The purpose of the dataset and the need it supports are clearly defined and documented.</li>\n          <li><strong>Verified source:</strong> The dataset's source, authority and role are documented so it is clear why the dataset should be relied upon for the proposed authoritative purpose and scope.</li>\n          <li><strong>Assigned custodian:</strong> A data custodian is identified and accountable for maintaining the dataset over time.</li>\n          <li><strong>High value:</strong> The data provides significant value to government programs, services, decision-making or reuse across teams and systems.</li>\n          <li><strong>Indigenous data considerations:</strong> Relevant Indigenous data governance, sovereignty, access, use and sharing requirements have been identified and addressed where applicable.</li>\n          <li><strong>Machine-readable data:</strong> The data can be processed, integrated and reused by systems where appropriate.</li>\n          <li><strong>Complete metadata:</strong> The dataset includes sufficient metadata, definitions and context for users to understand and appropriately use the data.</li>\n          <li><strong>Security classification:</strong> The dataset has been appropriately classified and relevant privacy, security and access requirements have been identified.</li>\n        </ul>\n        <p>Meeting one criterion alone does not make a dataset authoritative.</p>\n      </section>\n      <section id=\"designation-process\">\n        <h2>How the authoritative designation process works</h2>\n        <div class=\"process-strip\">\n          <div class=\"process-step\"><span class=\"n\">Step 1</span><strong>Awareness</strong><span>A potential authoritative dataset is identified. A candidate may be identified by a data provider, the Data Governance Team or another governance participant.</span></div>\n          <div class=\"process-step\"><span class=\"n\">Step 2</span><strong>Submission</strong><span>The data provider prepares and submits information about the candidate dataset, including its purpose, proposed authoritative scope, custodian and supporting evidence.</span></div>\n          <div class=\"process-step\"><span class=\"n\">Step 3</span><strong>Assessment</strong><span>The candidate is assessed against the authoritative data assessment criteria. The Data Governance Team works with the data provider and relevant subject matter experts to clarify information, identify gaps and understand whether the dataset can serve as the authoritative source for the proposed purpose.</span></div>\n          <div class=\"process-step\"><span class=\"n\">Step 4</span><strong>Decision</strong><span>The candidate may be approved as authoritative, not approved, or returned for additional information or updates before a decision is made.</span></div>\n          <div class=\"process-step\"><span class=\"n\">Step 5</span><strong>Post-decision</strong><span>Once approved, the authoritative designation is documented and the authoritative dataset information is published so users can discover and understand the trusted source. The <strong>data provider</strong> remains responsible for maintaining the dataset and keeping its authoritative information current.</span></div>\n        </div>\n      </section>\n      <section id=\"designation-roles\">\n        <h2>Roles and responsibilities</h2>\n        <ul class=\"clean-list\"><li><strong>Data Provider:</strong> Identifies and submits datasets, provides context, and remains accountable post-designation</li><li><strong>Data Governance Team:</strong> Facilitates intake, assessments, and process integrity; coordinates reviews and records decisions</li><li><strong>Executive Committee:</strong> Provides direction for complex or unresolved cases</li></ul>\n      </section>\n      <section id=\"designation-escalation\">\n        <h2>When escalation may be required</h2>\n        <p>Most designation requests are resolved through the standard assessment and governance process.</p>\n        <p>Escalation may be required when:</p>\n        <ul class=\"clean-list\"><li>More than one dataset could reasonably be considered authoritative for the same purpose</li><li>The proposed authoritative scope cannot be clearly agreed upon</li><li>Accountability or custodianship is unresolved</li><li>Significant legislative, policy, privacy or security issues require direction</li><li>Indigenous data governance or sovereignty considerations require additional review</li></ul>\n      </section>\n      <section id=\"manage-after-designation\">\n        <h2>What happens after designation</h2>\n        <p>Designation is not a one-time activity. Once a dataset is approved as authoritative, the approved purpose and scope are documented and the dataset must continue to be maintained as the trusted source.</p>\n        <h3>Maintain the designation</h3>\n        <p>After designation, the data provider is responsible for keeping the authoritative information current. This includes:</p>\n        <ul class=\"clean-list\"><li>Keeping the data and metadata current</li><li>Maintaining definitions, business rules and semantic information</li><li>Keeping source and lineage information current</li><li>Documenting known quality issues and limitations</li><li>Communicating significant changes</li><li>Reviewing the designation when the source, scope, custodian or use of the data changes</li></ul>\n        <h3>Consider whether the data should be a data register</h3>\n        <p>Authoritative designation does not automatically mean the dataset needs to be managed as a data register. If the data needs to be consistently shared or reused across services, consider whether the data-register approach applies.</p>\n        <p><a class=\"text-action\" href=\"#data-registers\" data-page=\"data-registers\">Learn about data registers<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section id=\"designation-ready\">\n        <h2>Ready to begin?</h2>\n        <p>Before starting the designation process, your team should be able to:</p>\n        <ul class=\"clean-list\"><li>Identify the data custodian</li><li>Explain the dataset’s purpose and proposed authoritative scope</li><li>Document the source and lineage</li><li>Confirm the data can be made available in a machine-readable form</li><li>Provide relevant metadata and definitions, including existing API specifications or schemas where applicable<br><a class=\"text-action\" href=\"#data-dictionary\" data-page=\"data-dictionary\" data-anchor=\"authoritative-designation-data-dictionary\">Review data dictionary guidance<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></li><li>Describe known quality and technical limitations</li><li>Explain how the data is maintained and updated</li><li>Identify the technical team responsible for making the data available and managing technical changes</li><li>Explain how significant changes will be managed</li></ul>\n        <p>If your team can provide this information, you are ready to begin the authoritative designation process and prepare the Candidate Dataset Submission Form.</p>\n        <p><a class=\"text-action\" href=\"https://bcgov.sharepoint.com/:w:/r/teams/00108/Shared%20Documents/TM_ADR/OPS%20Authoritative%20Data%20Designation/Process%20Materials/4-ADDP%20Candidate%20Dataset%20Submission%20Form.docx?d=w2fdb5722abec44bab1505dfcbb84365b&amp;csf=1&amp;web=1&amp;e=LTkOHf\" target=\"_blank\" rel=\"noopener\">Complete the Candidate Dataset Submission Form<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section id=\"designation-contact\">\n        <h2>Contact us</h2>\n        <p>Submit feedback, request more information, or get help through the <a class=\"text-action\" href=\"#\" data-placeholder-action=\"Shared TechDocs Help/Contact page — destination TBD\">placeholder link<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a>.</p>\n      </section>\n"
  },
  "data-registers": {
    "title": "Data registers",
    "nav": "Data registers",
    "group": "Provide data",
    "intro": "A data register is a set of data that contains authoritative data and follows a specific standard to ensure quality, interoperability and data sharing.",
    "body": "\n      <section>\n        <h2>How data registers relate to authoritative data</h2>\n        <p>Authoritative designation identifies the trusted source for a defined purpose and scope. A data register provides a standardized way to manage and make that authoritative data available for reuse by applying the requirements of the Data Register Standard.</p>\n        <p>Not every authoritative dataset needs to become a data register. A data register is a more standardized model for authoritative data that needs to be consistently maintained, shared and reused across services or systems.</p>\n      </section>\n      <section>\n        <h2>When to consider a data register</h2>\n        <p>A data register may be appropriate when authoritative data needs to serve as a consistent, trusted source for a defined subject or domain, or when shared reference data is needed so other systems can classify or interpret data consistently.</p>\n        <p><strong>Consider a data register when:</strong></p>\n        <ul class=\"clean-list\"><li>The authoritative data represents a clearly defined subject or domain</li><li>Multiple systems or services need to rely on the same trusted source</li><li>The data needs to be managed consistently over time</li><li>Stable identifiers and a history of changes are important for reuse</li><li>Shared reference data or code sets need to be used consistently across systems</li></ul>\n        <p>If your team determines that the data should be managed as a data register, review the Data Register Standard to understand the technical specifications and requirements the register must meet.</p>\n        <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Read the Data Register Standard — destination TBD\">Read the Data Register Standard<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Contact us</h2>\n        <p>Submit feedback, request more information, or get help through the <a class=\"text-action\" href=\"#\" data-placeholder-action=\"Shared TechDocs Help/Contact page — destination TBD\">placeholder link<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a>.</p>\n      </section>"
  },
  "data-register-standard": {
    "title": "Data Register Standard",
    "nav": "Data Register Standard",
    "group": "Data registers",
    "intro": "The Data Register Standard sets technical specifications for data registers. It is used by data delivery teams that collect and manage authoritative data in the form of data registers.",
    "body": "\n      <section>\n        <h2>About the Data Register Standard</h2>\n        <p>The Data Register Standard supports the development of a consistent and well-managed collection of authoritative data in data registers. Data registers that follow the Standard are intended to be trustworthy, secure, documented, discoverable and reusable. The Standard is the authoritative source for the requirements a data register must meet.</p>\n        <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Read the Data Register Standard\">Read the Data Register Standard<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Why this standard is important</h2>\n        <p>Using a consistent standard for data registers helps government manage and share authoritative data in reliable and interoperable ways.</p>\n        <p>The Standard helps government:</p>\n        <ul class=\"clean-list\"><li>Increase trust in services by providing timely, high-quality data</li><li>Support reusable data and more efficient software development</li><li>Improve decision-making, planning and service delivery</li><li>Provide a foundation for new digital products and services</li><li>Reduce duplication and unnecessary cost</li><li>Support progress toward collecting data once and reusing it across government</li></ul>\n      </section>\n      <section>\n        <h2>Guidance for applying the standard</h2>\n        <p>A set of guidelines are available to support the Data Register Standard. The guidelines help teams understand the concept of data registers and how to apply the Standard in practice.</p>\n        <p>The Guidelines provide additional explanation, considerations and examples across the same areas covered by the Standard, including governance, data accessibility, data quality, architecture, security and privacy.</p>\n        <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Data Register Standard Guidelines\">Read the Data Register Standard Guidelines<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Resources</h2>\n        <p>Related resources will be added here as the supporting content and links are confirmed.</p>\n        <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Resources — destination TBD\">Placeholder link<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Contact us</h2>\n        <p>Submit feedback, request more information, or get help through the <a class=\"text-action\" href=\"#\" data-placeholder-action=\"Shared TechDocs Help/Contact page — destination TBD\">placeholder link<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a>.</p>\n      </section>"
  },
  "semantics": {
    "title": "Semantics",
    "nav": "Semantics",
    "group": "Supporting reference",
    "intro": "The Connected Services semantic layer connects information through shared meaning. It provides a common framework for defining and organizing concepts, terms, relationships and information used across ministries, systems and services. By establishing a consistent understanding of business and technical concepts, it helps information be more easily discovered, connected, governed and reused.",
    "body": "\n      <section>\n        <h2>Why semantics matter</h2>\n        <p>Shared semantics help make sure your data can be understood consistently by the people and systems that use it.</p>\n        <p>Clear definitions and field-level documentation can help:</p>\n        <ul class=\"clean-list\"><li>Explain what the data represents</li><li>Reduce conflicting interpretations of the same concepts</li><li>Support consistent use across systems and services</li><li>Make data easier to share, integrate and reuse</li><li>Clarify the meaning and scope of authoritative data</li></ul>\n        <p>Without shared meaning, data can be interpreted differently across teams or systems, making it harder to reuse and govern consistently.</p>\n      </section>\n      <section>\n        <h2>How Connected Services supports shared meaning</h2>\n        <p>Authoritative designation and semantics address different aspects of how data is understood and used. Designation identifies which dataset is trusted for a defined purpose and scope. Semantics helps people and systems understand what the data means and how it should be interpreted.</p>\n        <p>Connected Services supports shared meaning through data dictionaries, the Connected Services Data Glossary and taxonomy. Taxonomy helps organize concepts so information can be classified and discovered consistently.</p>\n        <div class=\"resource-grid\">\n          <div class=\"resource-card\"><h3>Data dictionaries</h3><p>Data dictionaries document the business and technical information needed to understand individual fields in a dataset or API.</p><a class=\"text-action\" href=\"#data-dictionary\" data-page=\"data-dictionary\">Learn about data dictionaries<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"resource-card\"><h3>Connected Services Data Glossary</h3><p>The Connected Services Data Glossary provides shared definitions for concepts and terminology so they can be interpreted consistently across teams, systems and services.</p><a class=\"text-action\" href=\"#glossary\" data-page=\"glossary\">Learn about the Data Glossary<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n        </div>\n      </section>\n      <section>\n        <h2>Contact us</h2>\n        <p>Submit feedback, request more information, or get help through the <a class=\"text-action\" href=\"#\" data-placeholder-action=\"Shared TechDocs Help/Contact page — destination TBD\">placeholder link<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a>.</p>\n      </section>"
  },
  "data-dictionary": {
    "title": "Data dictionaries",
    "nav": "Data dictionaries",
    "group": "Semantics",
    "intro": "A data dictionary documents the fields in a dataset or API and provides the business and technical information needed to understand and use those fields.",
    "body": "\n      <section>\n        <p>Connected Services does not maintain a single master data dictionary. Field-level information may already exist in your organization’s API specifications, system documentation, schemas or other metadata.</p>\n        <p>Use this guidance to understand what field-level information your team should be able to provide when sharing data through Connected Services. You do not need to recreate information that is already documented in an existing source.</p>\n      </section>\n      <section>\n        <h2>What field-level information should you provide?</h2>\n        <p>Field-level documentation should provide enough information to understand what each field means and how it is implemented.</p>\n        <p>Depending on the field, this may include:</p>\n        <ul class=\"clean-list\"><li>Field name</li><li>Business meaning or definition</li><li>Data type and format</li><li>Permissible values</li><li>Constraints and business rules</li><li>Source or lineage information</li><li>Ownership or custodianship information</li><li>Related Connected Services Data Glossary terms, where applicable</li></ul>\n        <p>This information helps other teams understand what the data represents, how it is structured and how it should be interpreted.</p>\n      </section>\n      <section>\n        <h2>Use existing documentation</h2>\n        <p>Field-level information does not need to be recreated in a separate document if it is already maintained in an existing technical source.</p>\n        <h3>OpenAPI specifications</h3>\n        <p>For APIs documented using OpenAPI, field-level information may be included directly in the specification, such as field descriptions, data types, formats, allowed values and other relevant metadata.</p>\n        <h3>Other machine-readable documentation</h3>\n        <p>Field-level information may also be documented through formats such as JSON Schema, GraphQL SDL, WSDL or other machine-readable documentation.</p>\n        <h3>Existing supporting documentation</h3>\n        <p>Relevant information may also already exist in system documentation, data models or other supporting metadata.</p>\n        <p>Use existing documentation where it provides the information needed to understand the fields rather than creating duplicate documentation solely for Connected Services.</p>\n      </section>\n      <section id=\"authoritative-designation-data-dictionary\">\n        <h2>For authoritative designation</h2>\n        <p>When a dataset is being considered for authoritative designation, the data dictionary helps demonstrate the proposed scope of authority by documenting the business attributes associated with the dataset.</p>\n        <p>For the designation process, providers should be prepared to document:</p>\n        <ul class=\"clean-list\"><li>System field name</li><li>Field description, including the business meaning and intended use</li><li>Provenance of the field, using the Candidate Dataset Submission Form categories: Master, Reference or Derived data</li><li>The source of reference or derived data, where applicable</li><li>Which fields fall within the proposed authoritative scope</li></ul>\n        <p>Include fields that are exposed to or shared with users and represent meaningful business concepts. Purely technical or system-generated fields generally do not need to be included unless they are required to understand the business meaning of the data.</p>\n        <p><a class=\"text-action\" href=\"https://bcgov.sharepoint.com/:w:/r/teams/00108/Shared%20Documents/TM_ADR/OPS%20Authoritative%20Data%20Designation/Process%20Materials/4-ADDP%20Candidate%20Dataset%20Submission%20Form.docx?d=w2fdb5722abec44bab1505dfcbb84365b&amp;csf=1&amp;web=1&amp;e=LTkOHf\" target=\"_blank\" rel=\"noopener\">Complete the Data Dictionary section of the Candidate Dataset Submission Form<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>How data dictionaries relate to the Connected Services Data Glossary</h2>\n        <p>A data dictionary documents how data is represented in individual fields, including its business and technical details. The Connected Services Data Glossary provides shared definitions for concepts and terms used across Connected Services.</p>\n        <p>Where an agreed Data Glossary definition exists, reference or align your field-level documentation with it where appropriate.</p>\n        <p><a class=\"text-action\" href=\"#glossary\" data-page=\"glossary\">Learn about the Connected Services Data Glossary<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Contact us</h2>\n        <p>Submit feedback, request more information, or get help through the <a class=\"text-action\" href=\"#\" data-placeholder-action=\"Shared TechDocs Help/Contact page — destination TBD\">placeholder link<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a>.</p>\n      </section>"
  },
  "glossary": {
    "title": "Connected Services Data Glossary",
    "nav": "Connected Services Data Glossary",
    "group": "Semantics",
    "intro": "The Connected Services semantic layer connects information through shared meaning. It provides a common framework for defining and organizing the concepts, terms, relationships and information used across ministries, systems and services. By establishing a consistent understanding of business and technical concepts, it enables information to be more easily discovered, connected, governed and reused across the Connected Services ecosystem.",
    "body": "\n      <section>\n        <p>The Connected Services Data Glossary is part of this semantic layer. It provides shared definitions for concepts and terminology so they can be understood and used consistently across teams, systems and services.</p>\n      </section>\n      <section>\n        <h2>How to use the Data Glossary</h2>\n        <h3>If you use data</h3>\n        <p>Use the Data Glossary to confirm the agreed meaning of terms associated with the data you are using.</p>\n        <h3>If you provide or manage data</h3>\n        <p>Check the Data Glossary when documenting your data to determine whether a shared term or definition already exists. Where an applicable shared definition exists, reference or align your documentation with it.</p>\n        <p><a class=\"text-action\" href=\"https://dev.developer.gov.bc.ca/docs/default/component/connected-services-semantics/\" target=\"_blank\" rel=\"noopener\">Open the Connected Services Data Glossary<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>What belongs in the Data Glossary</h2>\n        <p>The Data Glossary is for concepts and terminology that need a consistent meaning across teams, systems or services. Use the criteria below to determine whether a term belongs.</p>\n        <div class=\"glossary-scope-table-wrap\">\n          <table class=\"glossary-scope-table\">\n            <thead><tr><th scope=\"col\">Category</th><th scope=\"col\">Include it when...</th></tr></thead>\n            <tbody>\n              <tr><td>Business</td><td>It describes a real-world entity, idea or relationship that business users would recognize independently of a system.</td></tr>\n              <tr><td>Data</td><td>It defines or qualifies a business concept for use in data, reporting or measurement.</td></tr>\n              <tr><td>Data management</td><td>It describes concepts related to data quality, lifecycle, stewardship or management.</td></tr>\n              <tr><td>Integration</td><td>It describes the exchange, flow or coordination of data across systems or organizational boundaries.</td></tr>\n              <tr><td>Privacy and security</td><td>It defines concepts related to access, protection, identity, permissions or privacy.</td></tr>\n              <tr><td>Technical</td><td>It describes a shared system-level or data-architecture concept rather than a specific implementation detail.</td></tr>\n              <tr><td>Operational</td><td>It describes shared concepts related to monitoring, reliability or operating data systems and services.</td></tr>\n            </tbody>\n          </table>\n        </div>\n        <h3>What does not belong</h3>\n        <ul class=\"clean-list\">\n          <li><strong>System- or tool-specific items:</strong> Terms tied to a specific tool, product, platform or technology belong in the relevant product or technical documentation.</li>\n          <li><strong>Guidelines, principles and processes:</strong> Content that describes how work is organized, governed or performed belongs in the relevant guidance or process documentation.</li>\n          <li><strong>Integration patterns and architectures:</strong> Implementation mechanisms and technical infrastructure belong in architecture or technical guidance.</li>\n          <li><strong>Technical schema details:</strong> Fields, formats, data types and schema structures belong in API specifications, schemas or data dictionaries.</li>\n        </ul>\n      </section>\n      <section>\n        <h2>How the Data Glossary relates to data dictionaries</h2>\n        <p>The Data Glossary defines shared concepts and terminology. A data dictionary documents how those concepts are represented in the fields and structures of a specific dataset or API.</p>\n        <p>Not every data field needs a corresponding Glossary term. Where a shared Glossary definition does apply, use it to help keep field-level documentation consistent.</p>\n        <p><a class=\"text-action\" href=\"#data-dictionary\" data-page=\"data-dictionary\">Learn about data dictionaries<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Add or update a term</h2>\n        <p>The workflow for adding or updating a Data Glossary term is still being confirmed.</p>\n        <div class=\"prototype-note\"><p><strong>Placeholder:</strong> This section is reserved for the confirmed workflow for adding or updating a term, including how to submit a request and what happens after it is submitted.</p></div>\n      </section>\n      <section>\n        <h2>Contact us</h2>\n        <p>Submit feedback, request more information, or get help through the <a class=\"text-action\" href=\"#\" data-placeholder-action=\"Shared TechDocs Help/Contact page — destination TBD\">placeholder link<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a>.</p>\n      </section>"
  }
};
const NAV_TREE = [
  {label: "Get started with data", page: "all-data"},
  {label: "Find and use datasets", page: "consumer"},
  {label: "Provide data", page: "provider", children: [
    {label: "How data is classified", page: "classify-manage"},
    {label: "Publishing data", page: "standard-publishing"},
    {label: "High-value data", page: "high-value"},
    {label: "Authoritative data", page: "authoritative", children: [
      {label: "Authoritative Data Designation", page: "designation"}
    ]},
    {label: "Data registers", page: "data-registers", children: [
      {label: "Data Register Standard", page: "data-register-standard"}
    ]}
  ]},
  {label: "Semantics", page: "semantics", children: [
    {label: "Data dictionaries", page: "data-dictionary"},
    {label: "Connected Services Data Glossary", page: "glossary"}
  ]},
];
const PAGE_ORDER = Object.keys(PAGES);
const HIDDEN_ROUTES = new Set();
const PAGE_FLOW = {
  "all-data": {lockBack: true},
  "consumer": {back: "all-data", backLabel: "Back to Get started with data"},
  "classify-manage": {back: "provider", backLabel: "Back to Provide data", lockBack: true},
  "provider": {back: "all-data", backLabel: "Back to Get started with data", lockBack: true},
  "standard-publishing": {back: "provider", backLabel: "Back to Provide data", lockBack: true},
  "high-value": {back: "provider", backLabel: "Back to Provide data", lockBack: true, next: "authoritative", nextLabel: "Authoritative data"},
  "authoritative": {back: "provider", backLabel: "Back to Provide data", lockBack: true, next: "designation", nextLabel: "Authoritative Data Designation"},
  "designation": {back: "authoritative", backLabel: "Back to Authoritative data", lockBack: true},
  "data-registers": {back: "designation", backLabel: "Back to Authoritative Data Designation", lockBack: true},
  "data-register-standard": {back: "data-registers"},
  "semantics": {back: "classify-manage", backLabel: "Back to How data is classified", next: "data-dictionary", nextLabel: "Data dictionaries"},
  "data-dictionary": {back: "semantics", next: "glossary", nextLabel: "Connected Services Data Glossary"},
  "glossary": {back: "data-dictionary"},
};

const article = document.getElementById('article');
const localNav = document.getElementById('local-nav');
const toast = document.getElementById('toast');
const searchInput = document.getElementById('doc-search');
const searchResults = document.getElementById('search-results');
let currentPage = null;
let previousPage = null;

function escapeHTML(value) {
  return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}
function showToast(message) {
  toast.textContent = message;
  toast.classList.add('show');
  window.clearTimeout(showToast.timer);
  showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 3000);
}
function navNodeContains(node, id) {
  return node.page === id || (node.children || []).some(child => navNodeContains(child, id));
}
function renderNavNode(node, level=1) {
  const containsCurrent = navNodeContains(node, currentPage);
  const children = node.children || [];
  const childHTML = children.map(child => renderNavNode(child, level + 1)).join('');
  if (!node.page) {
    return `<div class="local-nav-static local-nav-level-${level} ${containsCurrent ? 'section-active' : ''}">${escapeHTML(node.label)}</div>${childHTML}`;
  }
  const isCurrent = node.page === currentPage;
  return `<a href="#${node.page}" data-page="${node.page}" class="local-nav-level-${level} ${isCurrent ? 'active' : containsCurrent ? 'section-active' : ''}" ${isCurrent ? 'aria-current="page"' : ''}>${escapeHTML(node.label)}</a>${childHTML}`;
}
function renderLocalNav() {
  localNav.innerHTML = `<h2 class="local-nav-title">ADR TechDocs</h2><div class="local-nav-tree">${NAV_TREE.map(item => renderNavNode(item, 1)).join('')}</div>`;
}
function findNavPath(id, nodes=NAV_TREE, path=[]) {
  for (const node of nodes) {
    const nextPath = [...path, node];
    if (node.page === id) return nextPath;
    if (node.children) {
      const found = findNavPath(id, node.children, nextPath);
      if (found) return found;
    }
  }
  return null;
}
const BREADCRUMB_PARENT = {
  "consumer": "all-data",
  "provider": "all-data",
  "classify-manage": "provider",
  "standard-publishing": "provider",
  "high-value": "provider",
  "authoritative": "provider",
  "designation": "authoritative",
  "data-registers": "provider",
  "data-register-standard": "data-registers",
  "semantics": "classify-manage",
  "data-dictionary": "semantics",
  "glossary": "semantics"
};
function breadcrumbPath(id) {
  const path = [];
  let cursor = id;
  const seen = new Set();
  while (cursor && PAGES[cursor] && !seen.has(cursor)) {
    seen.add(cursor);
    path.unshift(cursor);
    cursor = BREADCRUMB_PARENT[cursor];
  }
  if (path[0] !== "all-data") path.unshift("all-data");
  return path;
}
function renderBreadcrumbs(id, page) {
  const separator = `<svg aria-hidden="true"><use href="#i-chevron"></use></svg>`;
  const path = breadcrumbPath(id);
  return path.map(pageId => {
    const label = PAGES[pageId].nav || PAGES[pageId].title;
    if (pageId === id) return `<span aria-current="page">${escapeHTML(label)}</span>`;
    return `<a href="#${pageId}" data-page="${pageId}">${escapeHTML(label)}</a>`;
  }).join(separator);
}
function renderPageFooter(id) {
  const flow = PAGE_FLOW[id] || {};
  const contextualBack = previousPage && previousPage !== id && PAGES[previousPage] ? previousPage : null;
  const backId = flow.lockBack ? flow.back : contextualBack || flow.back;
  const nextId = flow.next;
  const links = [];

  if (backId && PAGES[backId]) {
    const label = flow.backLabel || `Back to ${PAGES[backId].title}`;
    links.push(`<a class="prev" href="#${backId}" data-page="${backId}"><svg aria-hidden="true"><use href="#i-chevron"></use></svg>${escapeHTML(label)}</a>`);
  }
  if (nextId && PAGES[nextId]) {
    const label = flow.nextLabel || PAGES[nextId].title;
    links.push(`<a class="next" href="#${nextId}" data-page="${nextId}">Next: ${escapeHTML(label)}<svg aria-hidden="true"><use href="#i-chevron"></use></svg></a>`);
  }

  return links.length ? `<nav class="page-nav" aria-label="Page navigation">${links.join('')}</nav>` : '';
}
function renderPage(id, anchor='') {
  if (!PAGES[id]) id = 'all-data';
  const origin = currentPage;
  if (origin && origin !== id) previousPage = origin;
  currentPage = id;
  const page = PAGES[id];
  const intro = page.intro ? (id === 'provider' ? `<div class="provider-purpose"><strong>${escapeHTML(page.intro)}</strong></div>` : `<p class="lead">${escapeHTML(page.intro)}</p>`) : '';
  article.innerHTML = `
    <nav class="breadcrumbs" aria-label="Breadcrumb">${renderBreadcrumbs(id,page)}</nav>
    ${page.label ? `<p class="subtle-label page-type-label">${escapeHTML(page.label)}</p>` : ''}
    <h1>${escapeHTML(page.title)}</h1>
    ${intro}
    ${page.body}
    ${renderPageFooter(id)}`;
  renderLocalNav();
  document.title = `${page.title} | B.C. government DevHub`;
  document.getElementById('main-content').focus({preventScroll:true});
  window.requestAnimationFrame(() => {
    const target = anchor ? document.getElementById(anchor) : null;
    if (target) target.scrollIntoView({behavior: 'auto', block: 'start'});
    else window.scrollTo(0,0);
  });
  closeMobileNavigation();
}
function handlePageClick(event) {
  const link = event.target.closest('[data-page]');
  if (!link) return;
  event.preventDefault();
  renderPage(link.dataset.page, link.dataset.anchor || '');
}
document.addEventListener('click', handlePageClick);


document.addEventListener('click', event => {
  const action = event.target.closest('[data-placeholder-action]');
  if (!action) return;
  event.preventDefault();
  showToast(`${action.dataset.placeholderAction} is a placeholder destination in this prototype.`);
});
function stripHTML(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  return d.textContent || '';
}
function renderSearch() {
  const query = searchInput.value.trim().toLowerCase();
  if (!query) { searchResults.classList.remove('open'); searchResults.innerHTML = ''; return; }
  const ids = Object.keys(PAGES).filter(id => !HIDDEN_ROUTES.has(id));
  const matches = ids.filter(id => {
    const p = PAGES[id];
    return `${p.title} ${p.nav} ${p.group} ${p.intro} ${stripHTML(p.body)}`.toLowerCase().includes(query);
  }).slice(0,10);
  searchResults.innerHTML = matches.length ? matches.map(id => `<button class="search-result" data-page="${id}"><strong>${escapeHTML(PAGES[id].title)}</strong><span>${escapeHTML(PAGES[id].group)}</span></button>`).join('') : '<div class="search-empty">No matching prototype pages.</div>';
  searchResults.classList.add('open');
}
searchInput.addEventListener('input', renderSearch);
document.getElementById('search-clear').addEventListener('click', () => { searchInput.value=''; renderSearch(); searchInput.focus(); });
document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) searchResults.classList.remove('open'); });

document.querySelectorAll('[data-global]').forEach(item => item.addEventListener('click', () => {
  if (item.dataset.global === 'search') { searchInput.focus(); closeMobileNavigation(); }
  else if (item.dataset.global !== 'docs') showToast(`${item.textContent.trim()} is outside this prototype.`);
}));
const sidebar = document.getElementById('global-sidebar');
const scrim = document.getElementById('sidebar-scrim');
const menuOpen = document.getElementById('menu-open');
const localToggle = document.getElementById('local-nav-toggle');
function openMobileNavigation() { sidebar.classList.add('open'); scrim.classList.add('open'); menuOpen.setAttribute('aria-expanded','true'); }
function closeMobileNavigation() { sidebar.classList.remove('open'); scrim.classList.remove('open'); menuOpen.setAttribute('aria-expanded','false'); }
menuOpen.addEventListener('click', openMobileNavigation);
scrim.addEventListener('click', closeMobileNavigation);
localToggle.addEventListener('click', () => {
  const open = localNav.classList.toggle('open');
  localToggle.setAttribute('aria-expanded', String(open));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMobileNavigation(); searchResults.classList.remove('open'); } });
renderPage('all-data');
</script>
</body>
</html>
