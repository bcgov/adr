<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Interactive ADR TechDocs prototype for finding, publishing and managing government data." />
  <title>Connected Services | B.C. government DevHub</title>
  <style>
:root {
  --bc-navy: #003366;
  --bc-navy-dark: #00264d;
  --bc-blue: #1a5a96;
  --bc-blue-hover: #174f83;
  --bc-blue-light: #e8f1f8;
  --bc-yellow: #fdbf14;
  --bc-yellow-dark: #d89f00;
  --text: #252525;
  --muted: #5b616b;
  --border: #d8d8d8;
  --surface: #ffffff;
  --surface-soft: #f6f6f6;
  --info-bg: #eef6fb;
  --shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
  --focus: 0 0 0 3px #ffffff, 0 0 0 6px #2e5dd7;
  --sidebar: 206px;
  --radius: 3px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; color: var(--text); font-family: "BC Sans", Arial, sans-serif; font-size: 16px; line-height: 1.55; background: var(--surface); }
button, input { font: inherit; }
a { color: var(--bc-blue); }
a:hover { color: var(--bc-blue-hover); }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: none; box-shadow: var(--focus); }
.svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr-only { position: absolute!important; width: 1px!important; height: 1px!important; padding: 0!important; margin: -1px!important; overflow: hidden!important; clip: rect(0,0,0,0)!important; white-space: nowrap!important; border: 0!important; }
.skip-link { position: fixed; top: -100px; left: 16px; z-index: 9999; background: white; padding: 10px 14px; border: 3px solid var(--bc-yellow); color: var(--bc-navy); font-weight: 700; }
.skip-link:focus { top: 16px; }
.global-sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar); background: var(--bc-navy); color: white; z-index: 1000; overflow-y: auto; }
.sidebar-brand { min-height: 122px; padding: 24px 17px 18px; display: flex; align-items: flex-start; justify-content: flex-start; }
.bc-logo-link { display: inline-flex; align-items: center; max-width: 100%; }
.bc-logo { display: block; width: 169px; max-width: 100%; height: auto; }
.sidebar-close { display: none; color: white; }
.global-nav { padding-top: 6px; border-top: 1px solid rgba(255,255,255,.25); }
.global-nav-item { width: 100%; min-height: 52px; padding: 0 20px; border: 0; border-bottom: 1px solid rgba(255,255,255,.15); background: transparent; color: white; display: flex; align-items: center; gap: 12px; font-weight: 700; text-decoration: none; cursor: pointer; text-align: left; }
.global-nav-item svg { width: 20px; height: 20px; flex: 0 0 20px; }
.global-nav-item:hover { background: rgba(255,255,255,.09); color: white; }
.global-nav-item.active { box-shadow: inset 0 3px 0 #61a7ff, inset 0 -3px 0 #61a7ff; background: rgba(255,255,255,.035); }
.app-shell { margin-left: var(--sidebar); min-height: 100vh; }
.mobile-topbar { display: none; }
.devhub-header { padding: 42px 48px 34px; border-bottom: 1px solid #ececec; background: white; }
.devhub-title-row { max-width: 1500px; margin: 0 auto; display: flex; gap: 20px; align-items: stretch; }
.yellow-rule { width: 4px; background: var(--bc-yellow); flex: 0 0 4px; }
.eyebrow { color: var(--bc-blue); font-weight: 700; font-size: 14px; letter-spacing: .025em; text-transform: uppercase; margin-bottom: 2px; }
.devhub-title { font-size: clamp(30px, 3vw, 42px); line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
.devhub-title-row p { margin: 8px 0 0; max-width: 1000px; color: #333; }
.search-wrap { max-width: 1000px; margin: 28px auto 0; position: relative; display: flex; align-items: center; border: 1px solid #8d8d8d; border-radius: 999px; min-height: 58px; box-shadow: 0 4px 11px rgba(0,0,0,.12); background: white; }
.search-wrap > svg { width: 24px; height: 24px; margin-left: 20px; color: #444; }
.search-wrap input { border: 0; outline: 0; flex: 1; padding: 14px 16px; background: transparent; min-width: 0; }
.search-wrap button { border: 0; background: transparent; padding: 14px 22px; color: #333; cursor: pointer; }
.search-results { position: absolute; top: calc(100% + 8px); left: 14px; right: 14px; border: 1px solid var(--border); background: white; box-shadow: var(--shadow); z-index: 100; border-radius: var(--radius); display: none; max-height: 340px; overflow-y: auto; }
.search-results.open { display: block; }
.search-result { display: block; width: 100%; padding: 12px 16px; border: 0; border-bottom: 1px solid #ececec; text-align: left; background: white; cursor: pointer; }
.search-result:hover, .search-result:focus { background: var(--bc-blue-light); }
.search-result strong { display: block; color: var(--bc-blue); }
.search-result span { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.search-empty { padding: 16px; color: var(--muted); }
main { background: var(--surface-soft); min-height: calc(100vh - 240px); }
.docs-shell { max-width: 1540px; margin: 0 auto; padding: 32px 48px 80px; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 44px; align-items: start; }
.local-nav { position: sticky; top: 24px; background: white; border: 1px solid var(--border); box-shadow: 0 1px 3px rgba(0,0,0,.08); max-height: calc(100vh - 48px); overflow-y: auto; }
.local-nav-title { margin: 0; padding: 18px 18px 14px; font-size: 19px; color: var(--bc-navy); border-bottom: 4px solid var(--bc-yellow); }
.local-nav-group { border-bottom: 1px solid #e6e6e6; padding-bottom: 7px; }
.local-nav-group:last-child { border-bottom: 0; }
.local-nav-group-label {
  display: block;
  padding: 13px 16px 9px;
  color: #333;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0;
  text-decoration: none;
  border-left: 4px solid transparent;
  line-height: 1.35;
}
.local-nav a.local-nav-group-label:hover { background: #f2f7fb; color: var(--bc-navy); }
.local-nav a.local-nav-group-label.section-active { color: var(--bc-navy); background: #f8fafc; }
.local-nav a { display: block; padding: 7px 14px 7px 20px; color: var(--bc-blue); text-decoration: none; border-left: 4px solid transparent; line-height: 1.35; }
.local-nav a.local-nav-child { padding-left: 30px; }
.local-nav a.local-nav-level-1 { padding: 10px 14px 10px 18px; font-weight: 600; }
.local-nav a.local-nav-level-2, .local-nav .local-nav-static.local-nav-level-2 { padding-left: 34px; }
.local-nav a.local-nav-level-3 { padding-left: 50px; }
.local-nav .local-nav-static { display: block; padding: 8px 14px 8px 20px; color: #333; line-height: 1.35; font-weight: 600; }
.local-nav .local-nav-static.section-active { background: #f8fafc; color: var(--bc-navy); }
.local-nav .local-nav-tree { padding: 6px 0 8px; border-bottom: 1px solid #e6e6e6; }
.local-nav .local-nav-tree:last-child { border-bottom: 0; }
.local-nav a:hover { background: #f2f7fb; }
.local-nav a.active { background: var(--bc-blue-light); color: var(--bc-navy); border-left-color: var(--bc-yellow); font-weight: 700; }
.local-nav-toggle { display: none; }
.article { background: white; border: 1px solid #e1e1e1; padding: 38px 48px 48px; min-width: 0; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.breadcrumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; font-size: 14px; margin-bottom: 18px; color: var(--muted); }
.breadcrumbs a { text-decoration: none; }
.breadcrumbs svg { width: 14px; height: 14px; color: #777; }
.article h1 { font-size: clamp(34px, 4vw, 48px); line-height: 1.12; margin: 0 0 14px; letter-spacing: -.018em; }
.article h2 { font-size: clamp(25px, 2.5vw, 32px); line-height: 1.2; margin: 42px 0 14px; padding-top: 3px; }
.article h2::before { content: ""; display: block; width: 34px; height: 4px; background: var(--bc-yellow); margin-bottom: 12px; }
.article h3 { font-size: 21px; line-height: 1.3; margin: 25px 0 9px; }
.article p { max-width: 880px; margin: 0 0 16px; }
.article .lead { font-size: 16px; line-height: 1.55; color: #333; max-width: 950px; }
.placeholder {
  margin: 8px 0 0;
  max-width: 920px;
  color: #4a4a4a;
}
.placeholder strong { display: inline; color: inherit; }
.card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin: 22px 0 10px; }
.card { border: 1px solid var(--border); background: white; padding: 24px; box-shadow: 0 2px 5px rgba(0,0,0,.09); min-width: 0; }
.card h3 { margin: 0 0 9px; color: var(--bc-blue); }
.card p { margin-bottom: 18px; }
.path-card { border-top: 5px solid var(--bc-yellow); }
.path-label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.button-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 18px 0 0; }
.button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--bc-blue); padding: 9px 16px; border-radius: 2px; background: var(--bc-blue); color: white; text-decoration: none; font-weight: 700; cursor: pointer; }
.button:hover { background: var(--bc-blue-hover); color: white; }
.button.secondary { background: white; color: var(--bc-blue); }
.button.secondary:hover { background: var(--bc-blue-light); }
.button svg { width: 18px; height: 18px; }
.resource-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 18px; }
.resource-card { border: 1px solid var(--border); padding: 20px; background: white; }
.resource-card h2, .resource-card h3 { margin-top: 0; }
.resource-card h3 { color: var(--bc-navy); }
.resource-card .placeholder { margin-top: 10px; }
.accordion { border-top: 1px solid var(--border); margin-top: 22px; }
.accordion-item { border-bottom: 1px solid var(--border); }
.accordion-item summary { cursor: pointer; list-style: none; padding: 18px 44px 18px 4px; font-weight: 700; font-size: 19px; position: relative; color: var(--bc-navy); }
.accordion-item summary::-webkit-details-marker { display: none; }
.accordion-item summary::after { content: "+"; position: absolute; right: 12px; top: 14px; font-size: 28px; color: var(--bc-blue); font-weight: 400; }
.accordion-item[open] summary::after { content: "−"; }
.accordion-content { padding: 0 42px 20px 4px; }
.next-links { display: flex; flex-wrap: wrap; gap: 10px; }
.page-nav { display: flex; justify-content: space-between; gap: 18px; border-top: 1px solid var(--border); margin-top: 48px; padding-top: 24px; }
.page-nav a { display: flex; align-items: center; gap: 7px; font-weight: 700; text-decoration: none; max-width: 44%; }
.page-nav .next { margin-left: auto; text-align: right; }
.page-nav .prev svg { transform: rotate(180deg); }
.page-nav svg { width: 18px; height: 18px; flex: 0 0 18px; }
.toast { position: fixed; right: 24px; bottom: 24px; background: var(--bc-navy); color: white; padding: 12px 16px; box-shadow: var(--shadow); border-left: 5px solid var(--bc-yellow); opacity: 0; transform: translateY(16px); pointer-events: none; transition: .2s ease; z-index: 2000; max-width: 380px; }
.toast.show { opacity: 1; transform: translateY(0); }
.icon-button { border: 0; background: transparent; padding: 8px; display: inline-grid; place-items: center; cursor: pointer; }
.icon-button svg { width: 24px; height: 24px; }
.sidebar-scrim { display: none; }
@media (max-width: 1180px) { .docs-shell { grid-template-columns: 250px minmax(0,1fr); gap: 26px; padding-inline: 28px; } .article { padding: 32px; } }
@media (max-width: 900px) {
  :root { --sidebar: 286px; }
  .mobile-topbar { display: flex; position: sticky; top: 0; z-index: 900; height: 62px; background: var(--bc-navy); color: white; align-items: center; padding: 0 12px; gap: 12px; box-shadow: 0 2px 5px rgba(0,0,0,.2); }
  .mobile-wordmark { font-weight: 700; margin-left: auto; margin-right: 8px; }
  .mobile-topbar .icon-button { color: white; }
  .global-sidebar { transform: translateX(-101%); transition: transform .2s ease; width: var(--sidebar); }
  .global-sidebar.open { transform: translateX(0); }
  .sidebar-brand { min-height: 92px; }
  .sidebar-close { display: inline-grid; }
  .sidebar-scrim { display: block; position: fixed; inset: 0; z-index: 950; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .sidebar-scrim.open { opacity: 1; pointer-events: auto; }
  .app-shell { margin-left: 0; }
  .devhub-header { padding: 28px 22px; }
  .docs-shell { display: block; padding: 22px 18px 60px; }
  .local-nav-toggle { display: flex; width: 100%; align-items: center; justify-content: space-between; border: 1px solid var(--border); background: white; padding: 13px 14px; font-weight: 700; color: var(--bc-navy); margin-bottom: 14px; }
  .local-nav-toggle svg { width: 18px; height: 18px; transition: transform .2s; }
  .local-nav-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
  .local-nav { display: none; position: static; margin-bottom: 18px; max-height: none; }
  .local-nav.open { display: block; }
  .article { padding: 28px 24px 36px; }
}
@media (max-width: 650px) {
  body { font-size: 15px; }
  .devhub-title-row { gap: 12px; }
  .devhub-header { padding-inline: 16px; }
  .search-wrap { min-height: 52px; }
  .search-wrap button { padding-inline: 14px; }
  .article { padding: 24px 18px 32px; }
  .article h1 { font-size: 34px; }
  .article h2 { font-size: 26px; }
  .card-grid, .resource-grid { grid-template-columns: 1fr; }
  .page-nav { align-items: flex-start; }
  .page-nav a { max-width: 48%; }
}

.discovery-list {
  margin-top: 18px;
  max-width: 860px;
}
.discovery-resource {
  padding: 18px 0;
  border-top: 1px solid #d8d8d8;
}
.discovery-resource:first-child {
  border-top: 0;
  padding-top: 4px;
}
.discovery-resource h3 {
  margin: 0 0 6px;
  font-size: 20px;
  line-height: 1.3;
}
.discovery-resource p {
  margin: 0 0 7px;
  color: #4a4a4a;
}
.text-link {
  color: var(--bc-blue);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.text-link:hover {
  color: var(--bc-navy);
  text-decoration-thickness: 2px;
}


.document-link-section {
  padding-top: 10px;
}
.document-link {
  font-size: 16px;
}

.resource-text-link {
  margin: 10px 0 0;
}

.prototype-note { margin: 20px 0; padding: 16px 18px; border-left: 5px solid var(--bc-yellow); background: #fff8df; max-width: 920px; }
.prototype-note strong { color: var(--bc-navy); }
.info-callout { margin: 22px 0; padding: 18px 20px; border-left: 5px solid var(--bc-blue); background: var(--info-bg); max-width: 920px; }
.info-callout p:last-child, .prototype-note p:last-child { margin-bottom: 0; }
.topic-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; margin: 22px 0; max-width: 980px; }
.topic-card { border: 1px solid var(--border); border-top: 4px solid var(--bc-yellow); padding: 20px; background: white; }
.topic-card h3 { margin-top: 0; color: var(--bc-navy); }
.topic-card p:last-child { margin-bottom: 0; }
.text-action { display: inline-flex; align-items: center; gap: 6px; color: var(--bc-blue); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.text-action svg { width: 16px; height: 16px; }
.clean-list { max-width: 900px; padding-left: 24px; }
.clean-list li { margin: 6px 0; }
.check-list { list-style: none; padding-left: 0; max-width: 900px; }
.check-list li { position: relative; padding-left: 30px; margin: 9px 0; }
.check-list li::before { content: '✓'; position: absolute; left: 0; top: 0; color: var(--bc-blue); font-weight: 700; }
.route-options { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; margin: 20px 0; max-width: 980px; }
.route-card { border: 1px solid var(--border); padding: 22px; background: white; }
.route-card h3 { margin-top: 0; color: var(--bc-navy); }
.route-card .path-label { margin-bottom: 8px; }
.step-list { counter-reset: steps; list-style: none; padding: 0; max-width: 920px; }
.step-list > li { counter-increment: steps; position: relative; padding: 0 0 24px 54px; min-height: 48px; }
.step-list > li::before { content: counter(steps); position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--bc-navy); color: white; font-weight: 700; }
.step-list > li:not(:last-child)::after { content: ''; position: absolute; left: 16px; top: 38px; bottom: 4px; width: 2px; background: #c9d7e5; }
.step-list h3 { margin: 2px 0 6px; }
.process-strip { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 10px; margin: 22px 0; max-width: 980px; }
.process-step { border: 1px solid var(--border); border-top: 4px solid var(--bc-blue); padding: 14px; background: white; }
.process-step .n { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.process-step strong { display: block; color: var(--bc-navy); margin: 4px 0; }
.inline-links { display: flex; flex-wrap: wrap; gap: 12px 18px; margin: 14px 0 4px; }
.consumer-stacked-links { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin: 14px 0 4px; }
.muted { color: var(--muted); }
.criteria-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px 24px; max-width: 980px; padding-left: 20px; }
.assessment-criteria-list {
  display: block;
  max-width: 920px;
  margin: 18px 0 24px;
  padding: 20px 24px 20px 46px;
  border-left: 5px solid var(--bc-blue);
  background: var(--bc-blue-light);
}
.assessment-criteria-list li + li { margin-top: 10px; }
.support-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; margin: 20px 0; max-width: 980px; }
.support-card { border: 1px solid var(--border); padding: 20px; background: white; }
.support-card h3 { margin-top: 0; color: var(--bc-navy); }
.article .subtle-label { margin: 0 0 6px; color: var(--muted); font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.article code { background: #f2f2f2; padding: 2px 5px; border-radius: 3px; }
@media (max-width: 760px) {
  .topic-grid, .route-options, .criteria-list, .support-grid { grid-template-columns: 1fr; }
  .process-strip { grid-template-columns: 1fr; }
}


/* Provider routing page improvements */

  padding: 16px 18px;

.provider-intro {
  max-width: 900px;
  margin: -8px 0 24px;
  color: #333;
}
.provider-radio-options {
  border: 0;
  padding: 0;
  margin: 14px 0 10px;
  max-width: 880px;
}
.provider-radio-option {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 10px 12px;
  margin: 7px 0;
  border: 1px solid #d8d8d8;
  border-radius: 3px;
  background: white;
  cursor: pointer;
}
.provider-radio-option:hover { background: var(--bc-blue-light); }
.provider-radio-option input {
  margin: 4px 0 0;
  width: 18px;
  height: 18px;
  accent-color: var(--bc-blue);
  flex: 0 0 auto;
}
.provider-radio-option:has(input:checked) {
  border-color: var(--bc-blue);
  background: var(--info-bg);
}
.provider-decision-grid .decision-card { min-height: 180px; }
.provider-decision-grid .decision-card h3 { flex: 1; }
.provider-secondary-action { width: auto; min-width: 250px; }
.provider-after {
  max-width: 980px;
  margin-top: 26px;
  padding-top: 8px;
}
.provider-after-links { margin-top: 12px; }



@media (max-width: 1050px) {
  .provider-decision-grid { grid-template-columns: 1fr; }
}
@media (max-width: 650px) {
  .provider-step { padding: 22px 16px 20px; }
  .provider-step h2 { gap: 10px; }
  .step-number { flex-basis: 30px; width: 30px; height: 30px; }
  .provider-purpose { font-size: 16px; }
}


.supporting-materials-list .discovery-resource {
  border-top: 0;
  padding: 7px 0;
}
.supporting-materials-list .discovery-resource:first-child {
  padding-top: 4px;
}

</style>
</head>

<script>
const PAGES = {
  "all-data": {
    "title": "All data",
    "nav": "All data",
    "group": "Connected Services",
    "intro": "Connected Services helps B.C. government teams find, understand, publish, and reuse data. Data can be described in different ways depending on its value, its role, and how it is managed.",
    "body": "\n      <section>\n        <div class=\"info-callout\"><p>These are not separate types of data. A dataset can be high value, designated as authoritative for a defined purpose, and managed as a data register at the same time.</p></div>\n        <h2>How data is classified and managed</h2>\n        <div class=\"topic-grid\">\n          <div class=\"topic-card\"><h3>High-value data</h3><p>High-value data is data that holds significant value and is worth sharing.</p><a class=\"text-action\" href=\"#high-value\" data-page=\"high-value\">Learn more<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"topic-card\"><h3>Authoritative data</h3><p>Authoritative data is the designated source of truth for a specific subject.</p><a class=\"text-action\" href=\"#authoritative\" data-page=\"authoritative\">Learn more<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"topic-card\"><h3>Data registers</h3><p>A data register is a standardized way to manage and share authoritative data.</p><a class=\"text-action\" href=\"#data-registers\" data-page=\"data-registers\">Learn more<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"topic-card\"><h3>Other data</h3><p>Data does not need to be high value or authoritative to be useful. Other datasets can still be published and shared through standard processes.</p><a class=\"text-action\" href=\"#standard-publishing\" data-page=\"standard-publishing\">Learn more<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n        </div>\n      </section>\n      <section>\n        <h2>What do you want to do?</h2>\n        <div class=\"route-options\">\n          <div class=\"route-card\"><div class=\"path-label\">Consumer path</div><h3>Find datasets and APIs</h3><p>Search for datasets or APIs, understand what they mean, decide whether they fit your needs, and connect to them.</p><a class=\"text-action\" href=\"#consumer\" data-page=\"consumer\">Find datasets and APIs<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"route-card\"><div class=\"path-label\">Provider path</div><h3>Provide, publish or manage data</h3><p>Choose the right publishing or authoritative data path based on the data you manage.</p><a class=\"text-action\" href=\"#provider\" data-page=\"provider\">Provide, publish or manage data<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n        </div>\n      </section>"
  },
  "consumer": {
    "title": "Find datasets and APIs",
    "nav": "Find datasets and APIs",
    "group": "Consumer path",
    "intro": "Use this page if you are looking for datasets or APIs for a government service, product, analysis, or integration. This page helps you find available datasets and APIs, check if they fit your needs, understand their definitions, and connect to them. If a dataset has been designated as authoritative, an Authoritative label will appear on its page.",
    "body": "\n      <section>\n        <h2>Search for datasets and APIs</h2>\n        <div class=\"prototype-note\"><p><strong>Future state:</strong> Connected Services / ITK will allow users to search across available datasets and APIs. Dataset pages will provide information to help users evaluate the data, and datasets designated as authoritative will display an <strong>Authoritative</strong> label. Until this is available, link to the current approved discovery tools.</p></div>\n        <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Search available datasets and APIs\">Search available datasets and APIs<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Evaluate and understand the data</h2>\n        <p>Different teams and systems may use different names for the same concept. Shared semantics create common definitions and reusable concepts so people and systems understand data in the same way. This shared meaning reduces confusion and makes data easier to find, integrate, and reuse.</p>\n        <p>Authoritative does not mean “right for every use.” Check the context to understand what the data is authoritative for. If the dataset has an <strong>Authoritative</strong> label, confirm what it is authoritative for and whether that purpose and scope match your intended use.</p>\n        <p>Review:</p>\n        <ul class=\"clean-list\"><li>Purpose and scope</li><li>Source and custodian</li><li>Coverage</li><li>Freshness</li><li>Quality and limitations</li><li>Definitions and business rules</li><li>How the data changes</li><li>Access or reuse conditions</li></ul>\n      </section>\n      <section>\n        <h2>After you connect</h2>\n        <p>After you connect, monitor changes to any dataset or API that your service, product or analysis relies on.</p>\n      </section>\n      <section>\n        <h2>When your setup is complete</h2>\n        <p>Your initial setup is complete when you have:</p>\n        <ul class=\"check-list\"><li>Confirmed that the data fits your needs</li><li>Understood the important definitions and limitations</li><li>Connected through the approved access process</li><li>Identified how your team will monitor important changes</li></ul>\n        <p>Monitoring continues for as long as your service or product relies on the data.</p>\n      </section>",
    "label": "Consumer routing page"
  },
  "provider": {
    "title": "Provide, publish or manage data",
    "nav": "Provide, publish or manage data",
    "group": "Provider path",
    "label": "Provider routing page",
    "intro": "Use this page if your team maintains data and needs to publish it, manage it, assess whether it could be authoritative, or work with a data register.",
    "body": "\n      <section>\n        <h2>What do you need to do?</h2>\n        <p>Choose the option that best matches your situation.</p>\n        <div class=\"support-grid\">\n          <div class=\"support-card\"><h3>Publish a dataset</h3><p>Use this path if you need to publish data and are not sure which publishing guidance applies.</p><a class=\"text-action\" href=\"#publishing-new\" data-page=\"publishing-new\">Check whether your data is high value<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"support-card\"><h3>Start authoritative designation</h3><p>Use this path if the data is high value, may be the trusted source for a defined purpose, and has not yet been designated as authoritative.</p><a class=\"text-action\" href=\"#designation\" data-page=\"designation\">Review the Authoritative Data Designation Process<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"support-card\"><h3>Create or maintain a data register</h3><p>Use this path if you are deciding whether authoritative data should be managed as a data register, or your team already maintains a register.</p><a class=\"text-action\" href=\"#data-registers\" data-page=\"data-registers\">Use the data-register path<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"support-card\"><h3>Manage a published dataset</h3><p>Use this path if the dataset has already been designated and you need to understand what to publish, maintain or review next.</p><a class=\"text-action\" href=\"#manage-designated\" data-page=\"manage-designated\">Manage data after designation<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n        </div>\n      </section>"
  },
  "publishing-new": {
    "title": "Publishing a new dataset",
    "nav": "Publishing a new dataset",
    "group": "Provider path",
    "intro": "Use the following questions to identify the publishing path that applies.",
    "body": "\n      <section class=\"provider-step\">\n        <h2><span class=\"step-number\">1</span>Is your data high value?</h2>\n        <p>Start by confirming whether your dataset is considered high value.</p>\n        <ul class=\"decision-list\"><li><strong>Yes</strong> — continue to the next question</li><li><strong>No</strong> — <a class=\"text-action\" href=\"#standard-publishing\" data-page=\"standard-publishing\">follow the standard publishing guidance<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></li><li><strong>Not sure</strong> — <a class=\"text-action\" href=\"#high-value\" data-page=\"high-value\">use the high-value guidance to decide<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></li></ul>\n      </section>\n      <section class=\"provider-step\">\n        <h2><span class=\"step-number\">2</span>Could your high-value data be authoritative?</h2>\n        <p>If your data is high value, check whether it might be a potential authoritative-data candidate. A dataset may be ready for an initial conversation when the following are understood:</p>\n        <ul class=\"check-list\"><li>Clear purpose and scope</li><li>Known source and data custodian</li><li>A government program or service relies on the data</li><li>Other teams may reuse it</li><li>Definitions, quality and limitations can be documented</li></ul>\n        <p>These conditions do not guarantee designation. They indicate that the dataset may be ready to be assessed.</p>\n        <div class=\"support-grid\"><div class=\"support-card\"><h3>Yes, it meets these criteria</h3><a class=\"text-action\" href=\"#designation\" data-page=\"designation\">Review the Authoritative Data Designation Process<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div><div class=\"support-card\"><h3>No, it does not meet these criteria</h3><a class=\"text-action\" href=\"#high-value\" data-page=\"high-value\">Follow high-value data guidance<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div></div>\n      </section>\n      <section>\n        <h2>Still not sure?</h2>\n        <p>If you are not sure which path applies, contact ADR for help choosing the correct next step.</p>\n        <p><a class=\"text-action\" href=\"#help\" data-page=\"help\">Contact ADR about your data<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>"
  },

  "authoritative": {
    "title": "Authoritative data",
    "nav": "Authoritative data",
    "group": "Provider path",
    "intro": "Authoritative data is data that has been formally recognized as the trusted source for a defined purpose and scope. The designation helps users understand which source they should rely on when similar information exists in multiple places.",
    "body": "\n      <section>\n        <h2>Why trusted data matters</h2>\n        <p>Authoritative data helps teams use consistent information and reduces uncertainty about which source should be trusted.</p>\n        <div class=\"support-grid\">\n          <div class=\"support-card\"><h3>Without trusted data</h3><ul class=\"clean-list\"><li>Multiple versions of the same information</li><li>Duplicate collection and maintenance</li><li>Lower confidence in analysis and decision-making</li><li>Difficulty connecting and reusing data across services</li></ul></div>\n          <div class=\"support-card\"><h3>With trusted data</h3><ul class=\"clean-list\"><li>Clear accountability for the data</li><li>A trusted source for a defined purpose</li><li>Greater confidence in data reuse</li><li>Better integration across services and systems</li></ul></div>\n        </div>\n      </section>\n      <section>\n        <h2>What authoritative designation means</h2>\n        <p>An authoritative designation is the formal recognition of a dataset as the official and trusted source for a defined purpose and scope within government.</p>\n        <p>Designation confirms that the dataset has been assessed through the Authoritative Data Designation Process and that responsibility for maintaining the data is clear.</p>\n        <p>Designation does not guarantee:</p>\n        <ul class=\"clean-list\"><li>That the data is free from errors or quality issues</li><li>That the data is complete or suitable for every use case</li><li>Unrestricted access, use or sharing</li><li>Exemption from privacy, legal, policy or security requirements</li></ul>\n        <p>Known limitations, quality issues and conditions of use should continue to be documented so users understand how the data can — and cannot — be relied upon.</p>\n      </section>\n      <section>\n        <h2>Responsibilities before and after designation</h2>\n        <p>The data provider and data custodian remain responsible for the dataset throughout the designation process and after designation. Authoritative designation does not replace the source system or the teams responsible for managing the data.</p>\n        <h3>Before designation</h3>\n        <p>Before beginning the designation process, your team should be able to provide the information needed to support an assessment.</p>\n        <p>This includes:</p>\n        <ul class=\"clean-list\"><li>Defining the dataset's purpose and proposed authoritative scope</li><li>Identifying the responsible data custodian</li><li>Documenting relevant definitions and metadata</li><li>Identifying known limitations and available data quality information</li><li>Explaining how the data is maintained</li><li>Explaining how significant changes to the data are managed and communicated</li></ul>\n        <p>The formal assessment criteria are explained in the Authoritative Data Designation Process.</p>\n        <h3>After designation</h3>\n        <p>After designation, the data custodian is responsible for keeping the authoritative information current and ensuring users can understand how the data should be used.</p>\n        <p>This includes:</p>\n        <ul class=\"clean-list\"><li>Publishing or updating the dataset record</li><li>Keeping the approved purpose and authoritative scope clear</li><li>Maintaining metadata, definitions, quality information and known limitations</li><li>Communicating significant changes</li><li>Reviewing whether changes to the dataset could affect its authoritative designation</li><li>Considering whether the authoritative data should also be managed as a data register</li></ul>\n        <p><a class=\"text-action\" href=\"#manage-designated\" data-page=\"manage-designated\">Manage data after designation<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>What the Authoritative Data Registers team provides</h2>\n        <p>The Authoritative Data Registers (ADR) team supports teams through authoritative designation and the ongoing management of authoritative data.</p>\n        <p>The ADR team provides:</p>\n        <ul class=\"clean-list\"><li>Guidance for the Authoritative Data Designation Process</li><li>Assessment criteria and designation support</li><li>The Data Register Standard and related guidance</li><li>Data quality guidance and standards</li><li>Semantics and shared definitions</li><li>Support for maintaining authoritative information over time</li></ul>\n      </section>\n      <section>\n        <h2>Choose your next step</h2>\n        <p>Choose the option that best matches the current status of your data.</p>\n        <div class=\"support-grid\">\n          <div class=\"support-card\"><h3>You want to designate a dataset</h3><p>If your dataset may be the trusted source for a defined purpose, review the Authoritative Data Designation Process to understand how designation works and what your team will need to prepare.</p><a class=\"text-action\" href=\"#designation\" data-page=\"designation\">Review the Authoritative Data Designation Process<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"support-card\"><h3>Your data is already designated</h3><p>If your dataset has already been approved as authoritative, review what needs to be published, maintained and updated over time.</p><a class=\"text-action\" href=\"#manage-designated\" data-page=\"manage-designated\">Manage data after designation<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"support-card\"><h3>You are considering a data register</h3><p>If authoritative data needs to be consistently maintained and reused across services or systems, determine whether it should also be managed as a data register.</p><a class=\"text-action\" href=\"#data-registers\" data-page=\"data-registers\">Decide whether to use a data register<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"support-card\"><h3>You are not sure what applies</h3><p>Contact the ADR team for help determining the appropriate path for your dataset.</p><a class=\"text-action\" href=\"#help\" data-page=\"help\">Contact ADR about authoritative data<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n        </div>\n      </section>"
  },
  "designation": {
    "title": "Authoritative Data Designation Process overview",
    "nav": "Authoritative Data Designation Process overview",
    "group": "Authoritative data",
    "intro": "The Authoritative Data Designation Process (ADDP) is the process used to assess and formally recognize a dataset as authoritative for a defined purpose and scope. The process creates confidence in which data sources government should trust and reuse by providing a consistent assessment, clear accountability and government-wide recognition of authoritative data. Designation is based on evidence across several criteria. No single criterion determines the outcome — the evidence is considered together to understand whether the dataset can reliably serve as the authoritative source for its defined purpose.",
    "body": "\n      <section>\n        <h2>Assessment criteria</h2>\n        <p>A candidate dataset is assessed against a set of criteria that help determine whether it can be formally recognized as authoritative.</p>\n        <p>The criteria consider whether the dataset has:</p>\n        <ul class=\"assessment-criteria-list\">\n          <li><strong>Clear purpose:</strong> The purpose of the dataset and the need it supports are clearly defined and documented.</li>\n          <li><strong>Verified source:</strong> The dataset's source, authority and role are documented so it is clear why the dataset should be relied upon for the proposed authoritative purpose and scope.</li>\n          <li><strong>Assigned custodian:</strong> A data custodian is identified and accountable for maintaining the dataset over time.</li>\n          <li><strong>High value:</strong> The data provides significant value to government programs, services, decision-making or reuse across teams and systems.</li>\n          <li><strong>Indigenous data considerations:</strong> Relevant Indigenous data governance, sovereignty, access, use and sharing requirements have been identified and addressed where applicable.</li>\n          <li><strong>Machine-readable data:</strong> The data can be processed, integrated and reused by systems where appropriate.</li>\n          <li><strong>Complete metadata:</strong> The dataset includes sufficient metadata, definitions and context for users to understand and appropriately use the data.</li>\n          <li><strong>Security classification:</strong> The dataset has been appropriately classified and relevant privacy, security and access requirements have been identified.</li>\n        </ul>\n        <p>The ADR team considers the criteria together when assessing a candidate. Meeting one criterion alone does not make a dataset authoritative.</p>\n        <nav class=\"page-nav section-next-nav\" aria-label=\"Section navigation\"><a class=\"next\" href=\"#designation:designation-process\" data-page=\"designation\" data-anchor=\"designation-process\">Next section<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></nav>\n      </section>\n      <section id=\"designation-process\">\n        <h2>How the authoritative designation process works</h2>\n        <p>The ADDP consists of five primary steps.</p>\n        <div class=\"process-strip\">\n          <div class=\"process-step\"><span class=\"n\">Step 1</span><strong>Awareness</strong><span>A potential authoritative dataset is identified. A candidate may be identified by a data provider, the ADR team or another governance participant.</span></div>\n          <div class=\"process-step\"><span class=\"n\">Step 2</span><strong>Submission</strong><span>The data provider prepares and submits information about the candidate dataset, including its purpose, proposed authoritative scope, custodian and supporting evidence.</span></div>\n          <div class=\"process-step\"><span class=\"n\">Step 3</span><strong>Assessment</strong><span>The candidate is assessed against the authoritative data assessment criteria. The ADR team works with the data provider and relevant subject matter experts to clarify information, identify gaps and understand whether the dataset can serve as the authoritative source for the proposed purpose.</span></div>\n          <div class=\"process-step\"><span class=\"n\">Step 4</span><strong>Decision</strong><span>The candidate may be approved as authoritative, not approved, or returned for additional information or updates before a decision is made.</span></div>\n          <div class=\"process-step\"><span class=\"n\">Step 5</span><strong>Post-decision</strong><span>Once approved, the authoritative designation is documented and the authoritative dataset information is published so users can discover and understand the trusted source. The data custodian remains responsible for maintaining the dataset and keeping its authoritative information current.</span></div>\n        </div>\n      </section>\n      <section>\n        <h2>Roles and responsibilities</h2>\n        <h3>Data Provider</h3>\n        <p>The Data Provider:</p>\n        <ul class=\"clean-list\"><li>Identifies or proposes a candidate dataset</li><li>Provides information and supporting evidence</li><li>Works with the ADR team during assessment</li><li>Responds to questions or information gaps</li><li>Supports implementation of the designation decision</li></ul>\n        <h3>Data Custodian</h3>\n        <p>The Data Custodian:</p>\n        <ul class=\"clean-list\"><li>Is accountable for the dataset and its ongoing maintenance</li><li>Confirms the dataset's purpose, scope and governance</li><li>Maintains relevant metadata, definitions and quality information</li><li>Communicates significant changes after designation</li></ul>\n        <h3>Authoritative Data Registers team</h3>\n        <p>The ADR team:</p>\n        <ul class=\"clean-list\"><li>Guides teams through the designation process</li><li>Coordinates the assessment</li><li>Reviews evidence against the assessment criteria</li><li>Works with subject matter experts and governance participants where needed</li><li>Records and communicates the designation outcome</li><li>Supports ongoing maintenance of authoritative information</li></ul>\n        <h3>Executive review</h3>\n        <p>Executive review is used only when an issue cannot be resolved through the standard designation process.</p>\n        <p>This may include cases involving competing authoritative sources, unresolved scope or accountability questions, or significant legislative, policy, privacy, security or Indigenous data governance considerations.</p>\n      </section>\n      <section>\n        <h2>When escalation may be required</h2>\n        <p>Most designation requests are resolved through the standard assessment and governance process.</p>\n        <p>Escalation may be required when:</p>\n        <ul class=\"clean-list\"><li>More than one dataset could reasonably be considered authoritative for the same purpose</li><li>The proposed authoritative scope cannot be clearly agreed upon</li><li>Accountability or custodianship is unresolved</li><li>Significant legislative, policy, privacy or security issues require direction</li><li>Indigenous data governance or sovereignty considerations require additional review</li></ul>\n        <p>The ADR team coordinates escalation when it is required.</p>\n      </section>\n      <section>\n        <h2>What happens after designation</h2>\n        <p>Designation is not a one-time activity.</p>\n        <p>After a dataset is approved as authoritative:</p>\n        <ul class=\"clean-list\"><li>The approved purpose and authoritative scope are documented</li><li>The authoritative dataset information is published and made discoverable</li><li>The data custodian continues to maintain the dataset</li><li>Metadata, definitions, quality information and known limitations are kept current</li><li>Significant changes are reviewed to determine whether they affect the designation</li><li>The team may consider whether the data should also be managed as a data register</li></ul>\n        <p><a class=\"text-action\" href=\"#manage-designated\" data-page=\"manage-designated\">Manage data after designation<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section id=\"designation-resources\">\n        <h2>Authoritative designation forms and guidance</h2>\n        <p>Use these resources to understand the designation process and prepare a candidate submission.</p>\n        <div class=\"discovery-list supporting-materials-list\">\n          <div class=\"discovery-resource\"><h3><a class=\"text-link\" href=\"https://bcgov.sharepoint.com/:w:/r/teams/00108/Shared%20Documents/TM_ADR/GOV%20Auth%20Data%20Management/Authoritative%20Data%20Process/Implementation/Process%20Materials/4-ADDP%20Assessment%20Criteria.docx?d=w9b6c9e98c0e2497da2c2a9b0bc666986&amp;csf=1&amp;web=1&amp;e=4ci3dY\" target=\"_blank\" rel=\"noopener\">Review the ADDP assessment criteria</a></h3></div>\n          <div class=\"discovery-resource\"><h3><a class=\"text-link\" href=\"https://bcgov.sharepoint.com/:w:/r/teams/00108/Shared%20Documents/TM_ADR/GOV%20Auth%20Data%20Management/Authoritative%20Data%20Process/Implementation/Process%20Materials/3-ADDP%20Guidance%20for%20Data%20Providers.docx?d=w5034ac8f23214954bc91da08eef763b3&amp;csf=1&amp;web=1&amp;e=U591rg\" target=\"_blank\" rel=\"noopener\">Read guidance for data providers</a></h3></div>\n          <div class=\"discovery-resource\"><h3><a class=\"text-link\" href=\"https://bcgov.sharepoint.com/:w:/r/teams/00108/Shared%20Documents/TM_ADR/OPS%20Authoritative%20Data%20Designation/Process%20Materials/4-ADDP%20Candidate%20Dataset%20Submission%20Form.docx?d=w2fdb5722abec44bab1505dfcbb84365b&amp;csf=1&amp;web=1&amp;e=LTkOHf\" target=\"_blank\" rel=\"noopener\">Complete the Candidate Dataset Submission Form</a></h3></div>\n          <div class=\"discovery-resource\"><h3><a class=\"text-link\" href=\"https://bcgov.sharepoint.com/:b:/r/teams/00108/Shared%20Documents/TM_ADR/OPS%20Authoritative%20Data%20Designation/Process%20Materials/2-ADDP%20Service%20Blueprint.pdf?d=w99aa04deb05e4912822a34baa93d2810&amp;csf=1&amp;web=1&amp;e=azrM1H\" target=\"_blank\" rel=\"noopener\">View the ADDP service blueprint</a></h3></div>\n          <div class=\"discovery-resource\"><h3><a class=\"text-link\" href=\"https://bcgov.sharepoint.com/:w:/r/teams/00108/Shared%20Documents/TM_ADR/OPS%20Authoritative%20Data%20Designation/Process%20Materials/6-ADDP%20FAQ.docx?d=waa3c33ee4b374411928cfd0a5e127cef&amp;csf=1&amp;web=1&amp;e=Ih9Zob\" target=\"_blank\" rel=\"noopener\">Read the ADDP frequently asked questions</a></h3></div>\n        </div>\n      </section>\n      <section>\n        <h2>Ready to begin?</h2>\n        <p>If you think your dataset may be authoritative for a defined purpose, start by reviewing the assessment criteria and preparing the Candidate Dataset Submission Form.</p>\n        <p>You can also contact the ADR team before submitting if you are unsure whether your dataset is a suitable candidate.</p>\n        <div class=\"consumer-stacked-links\"><a class=\"text-action\" href=\"https://bcgov.sharepoint.com/:w:/r/teams/00108/Shared%20Documents/TM_ADR/OPS%20Authoritative%20Data%20Designation/Process%20Materials/4-ADDP%20Candidate%20Dataset%20Submission%20Form.docx?d=w2fdb5722abec44bab1505dfcbb84365b&amp;csf=1&amp;web=1&amp;e=LTkOHf\" target=\"_blank\" rel=\"noopener\">Prepare a designation submission<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a><a class=\"text-action\" href=\"#help\" data-page=\"help\">Contact ADR about submitting a candidate<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n      </section>"
  },
  "manage-designated": {
    "title": "Manage data after designation",
    "nav": "Manage data after designation",
    "group": "Authoritative data",
    "intro": "Use this page if your dataset has been approved as authoritative.",
    "body": "\n      <section><div class=\"prototype-note\"><p><strong>Placeholder only.</strong></p></div><h2>Publish the designation</h2><p>The publishing process can remain a placeholder until the workflow is confirmed.</p><p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Publish or update the authoritative dataset record — process TBD\">Publish or update the authoritative dataset record — process TBD<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p></section>\n      <section><h2>Maintain the authoritative information</h2><p>After designation the data custodian is responsible for:</p><ul class=\"clean-list\"><li>Keeping the data and metadata current</li><li>Maintaining definitions and business rules</li><li>Documenting known quality issues and limitations</li><li>Communicating important changes</li><li>Reviewing the information when the source, scope, custodian or use of the data changes</li></ul><p>Contact ADR if a significant change could affect the dataset’s authoritative designation.</p><p><a class=\"text-action\" href=\"#help\" data-page=\"help\">Contact ADR about a change to authoritative data<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p></section>"
  },
  "data-registers": {
    "title": "Data registers",
    "nav": "Data registers",
    "group": "Provider path",
    "intro": "A data register is a standardized way to manage and share authoritative data. It follows the Data Register Standard so the data can be trusted, understood, accessed and reused consistently. Use this page if your team is deciding whether authoritative data should be managed as a data register or already maintains a data register.",
    "body": "\n      <section>\n        <h2>How data registers relate to authoritative data</h2>\n        <p>Authoritative data and data registers are related, but they are not the same thing.</p>\n        <ul class=\"clean-list\"><li><strong>Authoritative data</strong> is recognized as the trusted source for a defined purpose and scope.</li><li><strong>A data register</strong> describes how authoritative data is governed, maintained and shared according to the Data Register Standard.</li></ul>\n        <p>Authoritative data can exist without being managed as a data register.</p>\n        <p>If authoritative data needs to be consistently maintained, shared or reused across services and systems, your team may want to consider whether it should also be managed as a data register.</p>\n      </section>\n      <section>\n        <h2>What makes a data register</h2>\n        <p>A data register is more than an authoritative dataset. It must also meet requirements for how the data is governed, documented, accessed, maintained and protected.</p>\n        <p>The Data Register Standard groups these requirements into five areas. The descriptions below provide an overview and are not a complete list of requirements. Refer to the official Standard for the detailed requirements.</p>\n        <ul class=\"assessment-criteria-list\"><li><strong>Governance:</strong> Governance requirements include having a clear purpose, assigning a data custodian and following the legislation, policies and standards that apply to the data.</li><li><strong>Data accessibility:</strong> Data accessibility requirements include providing complete metadata, making the register discoverable and providing appropriate access for authorized users and systems.</li><li><strong>Data quality:</strong> Data quality requirements include using documented and verifiable processes to support data integrity, including data quality assessment and reporting.</li><li><strong>Data architecture:</strong> Data architecture requirements include defining the register as an authoritative source for a specific subject, including only the data needed for its purpose, using stable identifiers, maintaining a history of changes and using shared semantics.</li><li><strong>Security and privacy:</strong> Security and privacy requirements include applying the appropriate security classification, access controls, privacy requirements, auditing and other security standards.</li></ul>\n      </section>\n      <section>\n        <h2>Decide whether a data register is appropriate</h2>\n        <p>Authoritative designation does not automatically mean that data must be managed as a data register.</p>\n        <p>A data register may be appropriate when authoritative data:</p>\n        <ul class=\"clean-list\"><li>Will be reused across multiple services or systems</li><li>Needs to be maintained and shared in a consistent way</li><li>Has a clearly defined purpose and scope</li><li>Has an accountable data custodian</li><li>Needs stable identifiers or a history of changes</li><li>Needs to connect to other authoritative sources</li></ul>\n        <p>If these conditions do not apply, continue maintaining the authoritative data and its published dataset record.</p>\n        <p>If you are unsure whether a data register is appropriate, contact ADR before creating one.</p>\n        <p><a class=\"text-action\" href=\"#help\" data-page=\"help\">Contact ADR about a potential data register<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Before creating a data register</h2>\n        <p>Before creating a new data register, check whether an authoritative source for the same information already exists.</p>\n        <p>A new register should not duplicate authoritative data that is already managed elsewhere.</p>\n        <p>If an authoritative source already exists but is not currently managed as a data register, consider whether applying the Data Register Standard would improve how the data is maintained, shared and reused.</p>\n        <p>Before proceeding, confirm:</p>\n        <ul class=\"clean-list\"><li>The purpose and scope of the proposed register</li><li>The responsible data custodian</li><li>Whether an existing authoritative source or data register already meets the need</li></ul>\n        <p>If you are unsure, contact ADR before creating a new register.</p>\n      </section>\n      <section>\n        <h2>Choose your next step</h2>\n        <p>Choose the option that best matches your situation.</p>\n        <div class=\"support-grid\">\n          <div class=\"support-card\"><h3>You are considering a new data register</h3><p>If authoritative data may need to be managed as a data register, contact ADR before creating it and review the Data Register Standard and Guidelines.</p><div class=\"consumer-stacked-links\"><a class=\"text-action\" href=\"#help\" data-page=\"help\">Contact ADR about a potential data register<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a><a class=\"text-action\" href=\"#data-register-standard\" data-page=\"data-register-standard\">Review the Data Register Standard and Guidelines<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div></div>\n          <div class=\"support-card\"><h3>You already maintain a data register</h3><p>Use the Data Register Standard and Guidelines to review the register and identify any requirements that need to be addressed.</p><a class=\"text-action\" href=\"#data-register-standard\" data-page=\"data-register-standard\">Apply the Data Register Standard to an existing register<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"support-card\"><h3>A data register is not needed</h3><p><strong>Your data-register journey is complete.</strong></p><p>Continue maintaining the authoritative data and its published record. You do not need to continue through the data-register guidance.</p></div>\n        </div>\n      </section>"
  },

  "data-register-standard": {
    "title": "Data Register Standard",
    "nav": "Data Register Standard",
    "group": "Data registers",
    "intro": "The Data Register Standard defines the requirements that a data register must meet so authoritative data can be governed, maintained, accessed and reused consistently.",
    "body": "\n      <section>\n        <p>Use this page once your team has determined that a data register is appropriate, or if you already maintain a data register and need to review it against the Standard.</p>\n        <p>If you are still deciding whether a data register is appropriate, return to the Data registers page first.</p>\n        <p><a class=\"text-action\" href=\"#data-registers\" data-page=\"data-registers\">Return to Data registers<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Data Register Standard and Guidelines</h2>\n        <h3>Data Register Standard</h3>\n        <p>The Standard defines the requirements that a data register must meet.</p>\n        <p>Use it when designing a new data register, maintaining an existing register or reviewing a register against the requirements.</p>\n        <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Open the Data Register Standard\">Open the Data Register Standard<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n        <h3>Data Register Standard Guidelines</h3>\n        <p>The Guidelines provide practical guidance, examples and considerations to help teams understand and apply the requirements in the Standard.</p>\n        <p>Use the Guidelines alongside the Standard when you need help interpreting or implementing a requirement.</p>\n        <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Open the Data Register Standard Guidelines\">Open the Data Register Standard Guidelines<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n        <p>If the Standard and Guidelines differ, follow the Data Register Standard.</p>\n      </section>\n      <section>\n        <h2>How to apply the Standard</h2>\n        <p>Use the Standard when designing a new data register or reviewing an existing one.</p>\n        <p>Work through the requirements to identify:</p>\n        <ul class=\"clean-list\"><li>Which requirements are already being met</li><li>Which requirements need additional work</li><li>What supporting documentation or evidence is needed</li><li>Who is responsible for addressing any gaps</li></ul>\n        <p>Use the Guidelines alongside the Standard when you need practical help interpreting or implementing a requirement.</p>\n      </section>\n      <section>\n        <h2>Supporting guidance</h2>\n        <p>Some Data Register Standard requirements connect to other Connected Services guidance.</p>\n        <p>Use these resources when a specific requirement calls for additional information.</p>\n        <h3>Data quality</h3>\n        <p>Understand how data quality should be assessed, documented, monitored and communicated.</p>\n        <p><a class=\"text-action\" href=\"#data-quality\" data-page=\"data-quality\">Understand data-quality requirements for data registers<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n        <h3>Semantics</h3>\n        <p>Understand how shared definitions and consistent meaning help data be interpreted and reused across services and systems.</p>\n        <p><a class=\"text-action\" href=\"#semantics\" data-page=\"semantics\">Understand shared meaning and semantics<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n        <h3>Data dictionary</h3>\n        <p>Understand how field-level definitions, metadata and business rules can be documented consistently.</p>\n        <p><a class=\"text-action\" href=\"#data-dictionary\" data-page=\"data-dictionary\">Understand data dictionary requirements<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n        <h3>Need help?</h3>\n        <p>Contact ADR if you need help interpreting a requirement or applying the Data Register Standard.</p>\n        <p><a class=\"text-action\" href=\"#help\" data-page=\"help\">Get help applying the Data Register Standard<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>"
  },

  "semantics": {
    "title": "Semantics",
    "nav": "Semantics",
    "group": "Supporting reference",
    "intro": "Connected Services needs shared meaning and consistent structure so data can be used across APIs, data registers, and integrations.",
    "body": "\n      <section><p>Authoritative designation and semantics help teams trust data in different ways. Designation identifies the trusted dataset for a defined purpose. Semantics helps people and systems understand what the data represents when it is shared between services.</p></section>\n      <section><h2>Why semantics matter</h2><p>Shared semantics help teams:</p><ul class=\"clean-list\"><li>Understand what data represents</li><li>Use consistent definitions across systems</li><li>Reduce confusion when similar fields appear in different places</li><li>Make data easier to share and reuse</li><li>Know how data should be interpreted</li></ul><p>Without shared meaning, data can be misunderstood or used incorrectly.</p></section>\n      <section><h2>Future semantics content</h2><div class=\"prototype-note\"><p><strong>Placeholder only:</strong> This content is for future development and is not for the MVP.</p></div><ul class=\"clean-list\"><li><strong>Common vocabulary</strong> — shared language for concepts, terms, and words</li><li><strong>Taxonomy</strong> — organizes concepts into groups and shows broader or narrower relationships</li><li><strong>Ontology</strong> — describes concepts and how they relate to each other</li><li><strong>Knowledge graph</strong> — represents connected concepts and relationships, often using an ontology</li></ul></section>\n      <section><h2>What does the data mean?</h2><p>Understanding data requires more than knowing the name of a field. Teams may need to understand:</p><ul class=\"clean-list\"><li>What business concept the data represents</li><li>How that concept is defined</li><li>What business rules apply</li><li>How the data field is structured and implemented</li></ul><p>Connected Services uses the <strong>Connected Services Glossary</strong> to explain the business meaning and context of terms. The <strong>Data Dictionary</strong> records business and technical information about shared data fields.</p></section>\n      <section><h2>Data dictionaries</h2><p>A data dictionary explains the meaning and structure of each field. It helps providers document data consistently and helps consumers understand how to use it. A dictionary entry may include:</p><ul class=\"clean-list\"><li>Field name</li><li>Plain-language definition</li><li>Data type or format</li><li>Allowed values</li><li>Business rules</li><li>Relationships</li><li>Related glossary terms</li></ul></section>\n      <section><h2>Connected Services Glossary</h2><p>The Connected Services Glossary provides plain-language business definitions for terms used across Connected Services. It helps people interpret terms consistently across systems and services.</p><p><a class=\"text-action\" href=\"#glossary\" data-page=\"glossary\">Connected Services Glossary<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p><h3>Get help</h3><p><a class=\"text-action\" href=\"#help\" data-page=\"help\">Get help with semantics or shared definitions<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p></section>"
  },
  "help": {
    "title": "Help and support",
    "nav": "Help and support",
    "group": "Help and support",
    "intro": "Use this page if you are not sure which guidance applies, need help with a potential authoritative-data candidate, or have questions about data registers, data quality or semantics.",
    "body": "\n      <section>\n        <h2>Contact the ADR team</h2>\n        <p>Contact ADR for help with:</p>\n        <ul class=\"clean-list\"><li>Deciding whether data may be a potential authoritative candidate</li><li>The designation process, assessment criteria or forms</li><li>Understanding what to do after designation</li><li>Deciding whether a data register is appropriate</li><li>Interpreting the Data Register Standard</li><li>Understanding data-quality guidance</li><li>Semantics, Data Dictionary or Glossary questions</li><li>Finding the correct ADR resource or next step</li></ul>\n        <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Contact the ADR team — contact method TBD\">Contact the ADR team — contact method TBD<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Other Connected Services support</h2>\n        <p>Some questions are handled by other teams.</p>\n        <div class=\"support-grid\">\n          <div class=\"support-card\"><h3>Standard data publishing</h3><p>Get help publishing data that does not follow the authoritative-data process.</p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Get standard data publishing support — destination TBD\">Get standard data publishing support — destination TBD<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"support-card\"><h3>High-value data</h3><p>Get help deciding whether data is high value or understanding the high-value publishing process.</p><a class=\"text-action\" href=\"#high-value\" data-page=\"high-value\">high-value data<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"support-card\"><h3>API access and integration</h3><p>Get help with API onboarding, access or SDX integration.</p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Get API or SDX integration support — destination TBD\">Get API or SDX integration support — destination TBD<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"support-card\"><h3>TechDocs technical support</h3><p>Get help using DevHub or ITK TechDocs.</p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Get DevHub or TechDocs support — destination TBD\">Get DevHub or TechDocs support — destination TBD<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n        </div>\n      </section>\n      <section>\n        <h2>Find a resource</h2>\n        <div class=\"consumer-stacked-links\"><a class=\"text-action\" href=\"#designation\" data-page=\"designation\">Review the Authoritative Data Designation Process<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a><a class=\"text-action\" href=\"#designation-process:designation-resources\" data-page=\"designation-process\" data-anchor=\"designation-resources\">Review the ADDP assessment criteria<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a><a class=\"text-action\" href=\"#designation-process:designation-resources\" data-page=\"designation-process\" data-anchor=\"designation-resources\">Complete the Candidate Dataset Submission Form<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a><a class=\"text-action\" href=\"#data-register-standard\" data-page=\"data-register-standard\">Review the Data Register Standard<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a><a class=\"text-action\" href=\"#data-quality\" data-page=\"data-quality\">Understand data quality and fitness for purpose<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a><a class=\"text-action\" href=\"#data-dictionary\" data-page=\"data-dictionary\">Review shared field definitions in the Data Dictionary<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a><a class=\"text-action\" href=\"#glossary\" data-page=\"glossary\">Search the Connected Services Glossary<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n      </section>"
  },
  "data-quality": {
    "title": "Data quality",
    "nav": "Data quality",
    "group": "Provider path",
    "intro": "",
    "body": "<section><div class=\"prototype-note\"><p><strong>Placeholder only.</strong> Use this page for general information about data quality and fitness for purpose. This is supporting guidance. It is not a required step after authoritative designation.</p></div></section>"

  "data-quality-standard": {
    "title": "Data Quality Assessment Standard",
    "nav": "Data Quality Assessment Standard",
    "group": "Data quality",
    "intro": "",
    "body": "<section><div class=\"prototype-note\"><p><strong>Placeholder:</strong> The Data Quality Assessment Standard is a draft and is currently on hold. It does not introduce a government-wide requirement. Current data-quality requirements apply only to data registers through the Data Register Standard.</p></div></section>"

  "data-dictionary": {
    "title": "Data dictionary",
    "nav": "Data dictionary",
    "group": "Semantics",
    "intro": "The Data Dictionary records business and technical information about shared data fields used across Connected Services APIs and data registers. It helps teams understand the business concept each field represents and how the field is implemented.",
    "body": "\n      <section>\n        <p>Use the Data Dictionary when you need to understand how a shared data field is defined and implemented.</p>\n        <p>Consumers can use it to interpret fields. Providers can use it when documenting shared data.</p>\n      </section>\n      <section>\n        <h2>What the Data Dictionary is for</h2>\n        <p>The Data Dictionary describes what a shared data field represents and how it is implemented.</p>\n        <p>A Data Dictionary entry can include:</p>\n        <ul class=\"clean-list\"><li>Field name</li><li>Business meaning or concept</li><li>Data type and format</li><li>Permissible values</li><li>Constraints</li><li>Source references</li><li>Related Glossary terms</li></ul>\n        <p>This information helps teams understand what a shared data field represents and how it is structured and implemented.</p>\n      </section>\n      <section>\n        <h2>How it relates to other documentation</h2>\n        <p>The Data Dictionary complements other Connected Services information, including:</p>\n        <ul class=\"clean-list\"><li>API specifications</li><li>System data models</li><li>BC Data Catalogue records</li><li>Connected Services Glossary</li></ul>\n        <p>The Data Dictionary complements these sources by documenting what shared data fields represent and how they are implemented. It does not replace API specifications, system documentation, or the Connected Services Glossary.</p>\n      </section>\n      <section>\n        <h2>Data Dictionary and Glossary</h2>\n        <p>The Glossary and Data Dictionary provide different but related information. The Glossary explains the business meaning and context of terms. The Data Dictionary records business and technical information about data fields.</p>\n        <p>Together, they help users understand what data represents and how it is implemented. Not every Glossary term needs a corresponding Data Dictionary entry, and not every Data Dictionary entry needs a corresponding Glossary term.</p>\n      </section>\n      <section>\n        <h2>Creating and updating entries</h2>\n        <div class=\"prototype-note\"><p><strong>Future content:</strong> The workflow and governance for creating or updating Data Dictionary entries still need to be confirmed.</p></div>\n        <p>Until that process is available, contact ADR if you need help documenting or changing a shared field.</p>\n      </section>\n      <section>\n        <h2>Related guidance</h2>\n        <div class=\"consumer-stacked-links\"><a class=\"text-action\" href=\"#glossary\" data-page=\"glossary\">Look up a business term in the Connected Services Glossary<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a><a class=\"text-action\" href=\"#semantics\" data-page=\"semantics\">Understand data meaning and semantics<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n      </section>"
  },
  "glossary": {
    "title": "Connected Services Glossary",
    "nav": "Connected Services Glossary",
    "group": "Semantics",
    "intro": "The Connected Services Glossary provides plain-language explanations of business and technical terms used across Connected Services. It helps people interpret terms consistently when working across teams, systems, and services.",
    "body": "\n      <section>\n        <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Search the Connected Services Glossary\">Search the Connected Services Glossary<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>What the Glossary is for</h2>\n        <p>The Glossary explains the business meaning, scope, and context of terms. It helps users:</p>\n        <ul class=\"clean-list\"><li>Find plain-language definitions</li><li>Understand how terms are interpreted in a business context</li><li>Reduce ambiguity between teams and systems</li><li>Interpret data and documentation consistently</li></ul>\n      </section>\n      <section>\n        <h2>What you can find in the Glossary</h2>\n        <p>A Glossary entry can include:</p>\n        <ul class=\"clean-list\"><li>A term</li><li>A plain-language business definition</li><li>Its scope and context</li></ul>\n        <p>The Glossary focuses on <strong>business and conceptual meaning</strong> rather than the technical structure of individual data fields.</p>\n      </section>\n      <section>\n        <h2>How to use the Glossary</h2>\n        <h3>If you use data</h3>\n        <p>Review relevant Glossary terms to understand the business meaning and context of the data. This can help you decide whether you are interpreting the data correctly for your intended use.</p>\n        <div class=\"consumer-stacked-links\"><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Search for a business term\">Search for a business term<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n        <h3>If you provide or manage data</h3>\n        <p>Check the Glossary when documenting your data to see whether an existing definition applies. Use the approved guidance to request a new term or propose a change to an existing term.</p>\n        <div class=\"prototype-note\"><p><strong>Future content:</strong> Confirm what information providers must submit and how new or updated terms are reviewed.</p></div>\n        <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Request a new or updated Glossary term — process TBD\">Request a new or updated Glossary term — process TBD<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Glossary and Data Dictionary</h2>\n        <p>The Glossary and Data Dictionary provide different but related information. The Glossary explains the business meaning and context of terms. The Data Dictionary records business and technical information about data fields.</p>\n        <p>Together, they help users understand what data represents and how it is implemented. Not every Glossary term needs a corresponding Data Dictionary entry, and not every Data Dictionary entry needs a corresponding Glossary term.</p>\n      </section>\n      <section>\n        <h2>Governance and changes</h2>\n        <div class=\"prototype-note\"><p><strong>Placeholder:</strong> Confirm the final Glossary governance and change-request process before publication.</p></div>\n        <div class=\"consumer-stacked-links\"><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Request a new or updated Glossary term — process TBD\">Request a new or updated Glossary term — process TBD<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a><a class=\"text-action\" href=\"#help\" data-page=\"help\">Get help with Glossary or Data Dictionary questions<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n      </section>"
  }
};
