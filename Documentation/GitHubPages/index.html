  "authoritative": {
    "title": "Authoritative data",
    "nav": "Authoritative data",
    "group": "Provider path",
    "intro": "Authoritative data is data that has been formally designated as the trusted source for a defined purpose and scope.",
    "body": "\n      <section>\n        <p>Using authoritative data helps people and systems know which source should be relied on when the same or similar information exists in multiple places.</p>\n      </section>\n      <section>\n        <h2>Why trusted data matters</h2>\n        <p>Authoritative data helps reduce uncertainty about which information should be used and supports more consistent reuse across government.</p>\n        <div class=\"support-grid\">\n          <div class=\"support-card\"><h3>Without trusted data</h3><ul class=\"clean-list\"><li>Multiple versions of the same information</li><li>Duplicate collection and maintenance</li><li>Lower confidence in analysis and decision-making</li><li>Difficulty connecting and reusing data across services</li></ul></div>\n          <div class=\"support-card\"><h3>With trusted data</h3><ul class=\"clean-list\"><li>Clear accountability for the data</li><li>A trusted source for a defined purpose</li><li>Greater confidence when data is shared or reused</li><li>More consistent use of data across services and systems</li></ul></div>\n        </div>\n      </section>\n      <section>\n        <h2>When authoritative data may apply</h2>\n        <p>A dataset may be a potential candidate for authoritative designation when:</p>\n        <ul class=\"clean-list\"><li>There is a clear purpose for which the data should be trusted</li><li>The source and responsible data custodian are known</li><li>Government programs, services or systems rely on the data</li><li>The data may be reused by other teams or services</li></ul>\n        <p>Authoritative designation applies to a defined purpose and scope. It does not mean that a dataset is the authoritative source for every possible use of the information it contains.</p>\n      </section>\n      <section>\n        <h2>Think your dataset may be authoritative?</h2>\n        <p>If your dataset may be the trusted source for a defined purpose, review the Authoritative Data Designation Process to understand the assessment criteria, what your team needs to prepare, and what happens before and after designation.</p>\n        <p><a class=\"text-action\" href=\"#designation\" data-page=\"designation\">Review the Authoritative Data Designation Process<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>"
  },
  "designation": {
    "title": "Authoritative Data Designation Process overview",
    "nav": "Authoritative Data Designation Process overview",
    "group": "Authoritative data",
    "intro": "The ADDP purpose is to create confidence in which data source government should trust and reuse. It provides clear accountability, consistent assessment, government-wide recognition, and improved discoverability. The outcome is “Trusted data” that ministries and programs can rely on.",
    "body": "\n      <section>\n        <h2>What authoritative designation means</h2>\n        <p>An authoritative designation is the formal recognition of a dataset as the <strong>official and trusted source of truth</strong> for a specific subject area within government. It confirms that the dataset has been assessed against the <strong>Assessment criteria</strong>, supports clear accountability, and can be confidently reused as a trusted source of data.</p>\n        <p>Designation does not guarantee:</p>\n        <ul class=\"clean-list\"><li>High data quality or freedom from errors</li><li>Completeness, accuracy, or suitability for every use case</li><li>Unrestricted access, use, or sharing</li><li>Exemption from privacy, legal, policy, or security requirements</li></ul>\n        <p>Known limitations, data quality issues, and conditions of use should be documented so users understand how the dataset can—and cannot—be relied upon.</p>\n      </section>\n      <section id=\"designation-process\">\n        <h2>How the authoritative designation process works</h2>\n        <p>The ADDP consists of five primary steps.</p>\n        <div class=\"process-strip\">\n          <div class=\"process-step\"><span class=\"n\">Step 1</span><strong>Awareness</strong><span>A potential authoritative dataset is identified. A candidate may be identified by a data provider, the ADR team or another governance participant.</span></div>\n          <div class=\"process-step\"><span class=\"n\">Step 2</span><strong>Submission</strong><span>The data provider prepares and submits information about the candidate dataset, including its purpose, proposed authoritative scope, custodian and supporting evidence.</span></div>\n          <div class=\"process-step\"><span class=\"n\">Step 3</span><strong>Assessment</strong><span>The candidate is assessed against the authoritative data assessment criteria. The ADR team works with the data provider and relevant subject matter experts to clarify information, identify gaps and understand whether the dataset can serve as the authoritative source for the proposed purpose.</span></div>\n          <div class=\"process-step\"><span class=\"n\">Step 4</span><strong>Decision</strong><span>The candidate may be approved as authoritative, not approved, or returned for additional information or updates before a decision is made.</span></div>\n          <div class=\"process-step\"><span class=\"n\">Step 5</span><strong>Post-decision</strong><span>Once approved, the authoritative designation is documented and the authoritative dataset information is published so users can discover and understand the trusted source. The data custodian remains responsible for maintaining the dataset and keeping its authoritative information current.</span></div>\n        </div>\n      </section>\n      <section>\n        <h2>Assessment criteria</h2>\n        <p>A candidate dataset is assessed against a set of criteria that help determine whether it can be formally recognized as authoritative.</p>\n        <p>The criteria consider whether the dataset has:</p>\n        <ul class=\"assessment-criteria-list\">\n          <li><strong>Clear purpose:</strong> The purpose of the dataset and the need it supports are clearly defined and documented.</li>\n          <li><strong>Verified source:</strong> The dataset's source, authority and role are documented so it is clear why the dataset should be relied upon for the proposed authoritative purpose and scope.</li>\n          <li><strong>Assigned custodian:</strong> A data custodian is identified and accountable for maintaining the dataset over time.</li>\n          <li><strong>High value:</strong> The data provides significant value to government programs, services, decision-making or reuse across teams and systems.</li>\n          <li><strong>Indigenous data considerations:</strong> Relevant Indigenous data governance, sovereignty, access, use and sharing requirements have been identified and addressed where applicable.</li>\n          <li><strong>Machine-readable data:</strong> The data can be processed, integrated and reused by systems where appropriate.</li>\n          <li><strong>Complete metadata:</strong> The dataset includes sufficient metadata, definitions and context for users to understand and appropriately use the data.</li>\n          <li><strong>Security classification:</strong> The dataset has been appropriately classified and relevant privacy, security and access requirements have been identified.</li>\n        </ul>\n        <p>The ADR team considers the criteria together when assessing a candidate. Meeting one criterion alone does not make a dataset authoritative.</p>\n        \n      </section>\n      <section>\n        <h2>Roles and responsibilities</h2>\n        <ul class=\"clean-list\"><li><strong>Data Governance Team:</strong> Facilitates intake, assessment, and process integrity; coordinates reviews and records decisions</li><li><strong>Data Provider:</strong> Identifies and submits datasets, provides context, and remains accountable post-designation</li><li><strong>Executive Committee:</strong> Provides direction for complex or unresolved cases</li></ul>\n      </section>\n      <section>\n        <h2>When escalation may be required</h2>\n        <p>Most designation requests are resolved through the standard assessment and governance process.</p>\n        <p>Escalation may be required when:</p>\n        <ul class=\"clean-list\"><li>More than one dataset could reasonably be considered authoritative for the same purpose</li><li>The proposed authoritative scope cannot be clearly agreed upon</li><li>Accountability or custodianship is unresolved</li><li>Significant legislative, policy, privacy or security issues require direction</li><li>Indigenous data governance or sovereignty considerations require additional review</li></ul>\n        <p>The ADR team coordinates escalation when it is required.</p>\n      </section>\n      <section id=\"manage-after-designation\">\n        <h2>What happens after designation</h2>\n        <p>Designation is not a one-time activity. Once a dataset is approved as authoritative, the approved purpose and scope are documented and the dataset must continue to be maintained as the trusted source.</p>\n        <h3>Publish the designation</h3>\n        <div class=\"prototype-note\"><p><strong>Placeholder only.</strong> The publishing process can remain a placeholder until the workflow is confirmed.</p></div>\n        <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Publish or update the authoritative dataset record\">Publish or update the authoritative dataset record<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n        <h3>Maintain the designation</h3>\n        <p>After designation, the data custodian is responsible for keeping the authoritative information current. This includes:</p>\n        <ul class=\"clean-list\"><li>Keeping the data and metadata current</li><li>Maintaining definitions, business rules and semantic information</li><li>Keeping source and lineage information current</li><li>Documenting known quality issues and limitations</li><li>Communicating significant changes</li><li>Reviewing the designation when the source, scope, custodian or use of the data changes</li></ul>\n        <p>Contact us if a significant change could affect the dataset’s authoritative designation.</p>\n        <p><a class=\"text-action\" href=\"#help\" data-page=\"help\">Contact us about a change to authoritative data<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n        <h3>Consider whether the data should be a data register</h3>\n        <p>Authoritative designation does not automatically mean the dataset needs to be managed as a data register. If the data needs to be consistently shared or reused across services, consider whether the data-register approach applies.</p>\n        <p><a class=\"text-action\" href=\"#data-registers\" data-page=\"data-registers\">Learn about data registers<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section id=\"designation-resources\">\n        <h2>Forms and guidance</h2>\n        <p>Use these resources to understand the designation process and prepare a candidate submission.</p>\n        <div class=\"discovery-list supporting-materials-list\">\n          <div class=\"discovery-resource\"><h3><a class=\"text-link\" href=\"https://bcgov.sharepoint.com/:w:/r/teams/00108/Shared%20Documents/TM_ADR/GOV%20Auth%20Data%20Management/Authoritative%20Data%20Process/Implementation/Process%20Materials/4-ADDP%20Assessment%20Criteria.docx?d=w9b6c9e98c0e2497da2c2a9b0bc666986&amp;csf=1&amp;web=1&amp;e=4ci3dY\" target=\"_blank\" rel=\"noopener\">Review the ADDP assessment criteria</a></h3></div>\n          <div class=\"discovery-resource\"><h3><a class=\"text-link\" href=\"https://bcgov.sharepoint.com/:w:/r/teams/00108/Shared%20Documents/TM_ADR/GOV%20Auth%20Data%20Management/Authoritative%20Data%20Process/Implementation/Process%20Materials/3-ADDP%20Guidance%20for%20Data%20Providers.docx?d=w5034ac8f23214954bc91da08eef763b3&amp;csf=1&amp;web=1&amp;e=U591rg\" target=\"_blank\" rel=\"noopener\">Read guidance for data providers</a></h3></div>\n          <div class=\"discovery-resource\"><h3><a class=\"text-link\" href=\"https://bcgov.sharepoint.com/:w:/r/teams/00108/Shared%20Documents/TM_ADR/OPS%20Authoritative%20Data%20Designation/Process%20Materials/4-ADDP%20Candidate%20Dataset%20Submission%20Form.docx?d=w2fdb5722abec44bab1505dfcbb84365b&amp;csf=1&amp;web=1&amp;e=LTkOHf\" target=\"_blank\" rel=\"noopener\">Complete the Candidate Dataset Submission Form</a></h3></div>\n        </div>\n      </section>\n      <section>\n        <h2>Ready to begin?</h2>\n        <p>Before starting the designation process, your team should be able to:</p>\n        <ul class=\"clean-list\"><li>Identify the data custodian</li><li>Explain the dataset’s purpose and proposed authoritative scope</li><li>Document the source and lineage</li><li>Provide relevant metadata and definitions</li><li>Describe known quality issues and limitations</li><li>Explain how the data is maintained and updated</li><li>Identify the technical team responsible for making the data available</li><li>Explain how significant changes will be managed</li></ul>\n        <p>If your team can provide this information, you are ready to begin the authoritative designation process and prepare the Candidate Dataset Submission Form.</p>\n        <p><a class=\"text-action\" href=\"https://bcgov.sharepoint.com/:w:/r/teams/00108/Shared%20Documents/TM_ADR/OPS%20Authoritative%20Data%20Designation/Process%20Materials/4-ADDP%20Candidate%20Dataset%20Submission%20Form.docx?d=w2fdb5722abec44bab1505dfcbb84365b&amp;csf=1&amp;web=1&amp;e=LTkOHf\" target=\"_blank\" rel=\"noopener\">Complete the Candidate Dataset Submission Form<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n        <h3>Need help first?</h3>\n        <p>If some of this information is unclear, contact the ADR team before submitting.</p>\n        <p><a class=\"text-action\" href=\"#help\" data-page=\"help\">Contact us about a potential candidate<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n"
  },
  "data-registers": {
    "title": "Data registers",
    "nav": "Data registers",
    "group": "Provider path",
    "intro": "A data register is a standardized way to manage and share authoritative data so it can be consistently understood, accessed and reused across services and systems.",
    "body": "\n      <section>\n        <p>Authoritative data can exist without being managed as a data register. A data register may be appropriate when authoritative data needs to be shared or reused consistently across multiple services or systems.</p>\n      </section>\n      <section>\n        <h2>How data registers relate to authoritative data</h2>\n        <p>Authoritative data and data registers are related, but they are not the same thing. Authoritative designation identifies the trusted source for a defined purpose and scope.</p>\n        <p>A data register provides a consistent way to manage and make that authoritative data available for reuse.</p>\n        <p>If authoritative data needs to be consistently maintained, shared or reused across services and systems, your team may want to consider whether it should also be managed as a data register.</p>\n      </section>\n      <section>\n        <h2>Decide whether a data register is appropriate</h2>\n        <p>A data register may be appropriate when the authoritative data:</p>\n        <ul class=\"clean-list\"><li>Will be reused across multiple services or systems</li><li>Needs to be maintained and shared in a consistent way</li><li>Has a clearly defined purpose and scope</li><li>Has an accountable data custodian</li><li>Needs stable identifiers or a history of changes</li><li>Needs to connect with other authoritative sources</li></ul>\n      </section>\n      <section>\n        <h2>Choose your next step</h2>\n        <p>Choose the option that best matches your situation.</p>\n        <div class=\"support-grid\">\n          <div class=\"support-card\"><h3>A data register is appropriate</h3><p>If your team determines that the data should be managed as a data register, review the Data Register Standard and Guidelines before creating it.</p><a class=\"text-action\" href=\"#data-register-standard\" data-page=\"data-register-standard\">Review the Data Register Standard and Guidelines<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"support-card\"><h3>A data register is not needed</h3><p>If the authoritative data will be made available to other systems through an API or secure data exchange, continue to the applicable API Services / Secure Data Exchange guidance.</p><p>That guidance covers the technical requirements for documenting, securing, testing and making the API available.</p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Continue to API Services / Secure Data Exchange guidance\">Continue to API Services / Secure Data Exchange guidance<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"support-card\"><h3>You are not sure</h3><p>If you are not sure whether your authoritative data should be managed as a data register, contact us before proceeding.</p><a class=\"text-action\" href=\"#help\" data-page=\"help\">Contact us<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n        </div>\n      </section>"
  },

  "data-register-standard": {
    "title": "Data Register Standard",
    "nav": "Data Register Standard",
    "group": "Data registers",
    "intro": "The Data Register Standard defines the requirements that a data register must meet.",
    "body": "\n      <section>\n        <p>Use this page if your team has determined that authoritative data should be managed as a data register and needs to understand what to do next.</p>\n        <p>The Standard is the authoritative source for the requirements. This guidance helps providers understand how to approach the Standard as part of the Connected Services onboarding journey.</p>\n      </section>\n      <section>\n        <h2>What you need to do</h2>\n        <p>Before moving to technical implementation, your team should:</p>\n        <ul class=\"clean-list\"><li>Review the Data Register Standard</li><li>Identify which requirements apply to your register</li><li>Confirm which requirements are already being met</li><li>Identify any gaps that need to be addressed</li><li>Document the supporting information or evidence required</li><li>Confirm who is responsible for addressing outstanding requirements</li></ul>\n        <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Open the Data Register Standard\">Open the Data Register Standard<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Guidance for applying the standard</h2>\n        <p>Supporting guidance may be available to help teams interpret and apply the Standard in practice. Use the guidance when you need help understanding a requirement or determining how it applies to your register. If there is any difference between the Standard and supporting guidance, follow the Standard.</p>\n        <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Data Register Standard\">Data Register Standard Guidance<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Related guidance</h2>\n        <p>Some Data Register Standard requirements may connect to other Connected Services guidance, including semantics, data dictionaries, metadata and lineage.</p>\n        <p><a class=\"text-action\" href=\"#semantics\" data-page=\"semantics\">Review Semantics guidance<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n        <p><a class=\"text-action\" href=\"#data-dictionary\" data-page=\"data-dictionary\">Review Data dictionaries guidance<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Need help?</h2>\n        <p>Contact us if you need help interpreting a requirement or applying the Data Register Standard.</p>\n        <p><a class=\"text-action\" href=\"#help\" data-page=\"help\">Contact us<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>"
  },

  "semantics": {
    "title": "Semantics",
    "nav": "Semantics",
    "group": "Supporting reference",
    "intro": "Semantics connects information through shared meaning. It creates shared terminology, data definitions and conceptual structures so people and systems have a common understanding of data, both across government and within specific domains.",
    "body": "\n      <section>\n        <p>Using standard definitions helps reduce multiple or conflicting definitions for the same data concepts. This supports the “collect once” principle, where data can be collected once and reused across services to deliver value.</p>\n        <p>Shared definitions are also essential for interoperability. Common concepts such as <strong>person, resident, business, representation and address</strong> need to be understood consistently when data is shared across ministries, services and systems.</p>\n        <p>Authoritative designation and semantics help teams trust data in different ways. Designation identifies the trusted dataset for a defined purpose. Semantics helps people and systems understand what the data represents when it is shared between services.</p>\n      </section>\n      <section>\n        <h2>Why semantics matter</h2>\n        <p>Shared semantics help teams:</p>\n        <ul class=\"clean-list\"><li>Understand what data represents</li><li>Use consistent terminology and definitions</li><li>Reduce confusion when similar terms or fields appear in different places</li><li>Make data easier to share, integrate and reuse</li><li>Interpret authoritative data consistently</li><li>Reduce the need to redefine the same concepts in different systems</li></ul>\n        <p>Without shared meaning, data can be misunderstood, duplicated or used inconsistently.</p>\n      </section>\n      <section>\n        <h2>How Connected Services supports shared meaning</h2>\n        <p>Connected Services uses three related resources to help teams define, document and organize data consistently.</p>\n        <div class=\"resource-grid\">\n          <div class=\"resource-card\"><h3>Data dictionaries</h3><p>Data dictionaries document the business and technical information needed to understand individual fields in a dataset or API.</p><p>Providers may already maintain this information in API specifications, system documentation or other metadata.</p><a class=\"text-action\" href=\"#data-dictionary\" data-page=\"data-dictionary\">Learn about data dictionaries<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"resource-card\"><h3>Connected Services Data Glossary</h3><p>The Connected Services Data Glossary provides shared business and technical terminology used across Connected Services.</p><p>It helps teams understand the agreed meaning, context and intended use of concepts across ministries, systems and services.</p><a class=\"text-action\" href=\"#glossary\" data-page=\"glossary\">Open the Connected Services Data Glossary<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n          <div class=\"resource-card\"><h3>Taxonomy</h3><p>The Connected Services Taxonomy organizes data concepts into a consistent hierarchy so information can be classified, discovered and understood across government.</p><a class=\"text-action\" href=\"#taxonomy\" data-page=\"taxonomy\">Learn about Taxonomy<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n        </div>\n      </section>\n      <section>\n        <h2>What this means for your data</h2>\n        <p>When preparing data to be shared or reused, your team should be able to explain:</p>\n        <ul class=\"clean-list\"><li>What business concepts the data represents</li><li>How those concepts are defined</li><li>What business rules apply</li><li>How the data fields are structured and implemented</li><li>How the data should be classified so others can find and understand it</li></ul>\n        <p>Connected Services provides shared guidance and resources to help teams document this information consistently.</p>\n      </section>\n      <section>\n        <h2>Get help</h2>\n        <p>If you need help understanding semantic requirements or determining which guidance applies to your data, contact us.</p>\n        <p><a class=\"text-action\" href=\"#help\" data-page=\"help\">Contact us<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>"
  },
  "data-dictionary": {
    "title": "Data dictionaries",
    "nav": "Data dictionaries",
    "group": "Semantics",
    "intro": "A data dictionary documents the fields in a dataset or API and provides the business and technical information needed to understand and use those fields.",
    "body": "\n      <section>\n        <p>Connected Services does not maintain a single master data dictionary. Providers may already maintain this information in their own API specifications, system documentation or metadata.</p>\n        <p>Use this guidance to understand what field-level information your team should be able to provide when sharing data through Connected Services.</p>\n      </section>\n      <section>\n        <h2>What a data dictionary should contain</h2>\n        <p>Field-level documentation should include information such as:</p>\n        <ul class=\"clean-list\"><li>Field name</li><li>Business meaning or definition</li><li>Data type and format</li><li>Permissible values</li><li>Constraints and business rules</li><li>Source or lineage information</li><li>Ownership or custodianship information</li><li>Related shared business terms, where applicable</li></ul>\n        <p>This information helps other teams understand what the data represents, how it is structured and how it should be interpreted.</p>\n      </section>\n      <section>\n        <h2>How data dictionaries relate to the Connected Services Data Glossary</h2>\n        <p>Data dictionaries and the Connected Services Data Glossary provide different but related information.</p>\n        <p>A <strong>data dictionary</strong> describes how data is represented in individual fields, including business and technical details.</p>\n        <p>The <strong>Connected Services Data Glossary</strong> provides shared definitions for business concepts and terms used across Connected Services.</p>\n        <p>Where an agreed Glossary definition exists, providers should reference or align their field-level documentation with that definition where appropriate.</p>\n        <p><a class=\"text-action\" href=\"#glossary\" data-page=\"glossary\">Connected Services Data Glossary<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>What providers need to prepare</h2>\n        <p>When preparing data for Connected Services, your team should be able to provide field-level metadata through an existing data dictionary, API specification or other supporting documentation.</p>\n        <p>Depending on how your data is documented, this information may be provided through:</p>\n        <h3>OpenAPI specifications</h3>\n        <p>Field-level metadata may be included directly in an OpenAPI specification, including through appropriate extensions or linked semantic definitions.</p>\n        <h3>Other machine-readable documentation</h3>\n        <p>Supporting metadata may also be provided through formats such as:</p>\n        <ul class=\"clean-list\"><li>JSON Schema</li><li>GraphQL SDL</li><li>WSDL</li><li>Other machine-readable documentation</li></ul>\n        <h3>Existing supporting documentation</h3>\n        <p>If the required information already exists in your organization’s documentation, it may be provided as part of the metadata package rather than recreated in a separate data dictionary.</p>\n        <p>The exact metadata package and submission process will depend on the Connected Services onboarding path that applies to your data.</p>\n      </section>\n      <section>\n        <h2>Need help?</h2>\n        <p>If you are not sure what field-level documentation is required for your data, contact us.</p>\n        <p><a class=\"text-action\" href=\"#help\" data-page=\"help\">Contact us<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>"
  },
  "glossary": {
    "title": "Connected Services Data Glossary",
    "nav": "Connected Services Data Glossary",
    "group": "Semantics",
    "intro": "The Connected Services Data Glossary provides a shared language for Connected Services. It is the central source of business and technical terminology used across ministries, systems and services.",
    "body": "\n      <section>\n        <p>It defines the meaning, context and intended use of key concepts in plain language so information can be interpreted consistently and reused across Connected Services.</p>\n        <p><a class=\"text-action\" href=\"https://dev.developer.gov.bc.ca/docs/default/component/connected-services-semantics/\" target=\"_blank\" rel=\"noopener\">Open the Connected Services Data Glossary<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>What belongs in the Data Glossary</h2>\n        <p>The Data Glossary includes shared concepts related to:</p>\n        <ul class=\"clean-list\"><li>Business</li><li>Data</li><li>Data management</li><li>Integration</li><li>Privacy and security</li><li>Technical concepts</li><li>Operational concepts</li></ul>\n        <p>Terms should describe concepts that are useful across teams, systems or services rather than information that applies only to one specific implementation.</p>\n        <p><a class=\"text-action\" href=\"https://dev.developer.gov.bc.ca/docs/default/component/connected-services-semantics/\" target=\"_blank\" rel=\"noopener\">Review the Data Glossary Scope and Inclusion Criteria<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>What is not included</h2>\n        <p>The Data Glossary is not intended to document:</p>\n        <ul class=\"clean-list\"><li>Tool-, product- or system-specific terminology</li><li>Guidelines, principles or processes</li><li>Integration patterns or architecture</li><li>Low-level schema details such as individual fields, formats or data types</li></ul>\n        <p>These may be documented in other sources such as API specifications, data dictionaries, technical documentation or standards.</p>\n      </section>\n      <section>\n        <h2>How to use the Data Glossary</h2>\n        <h3>If you use data</h3>\n        <p>Use the Data Glossary to understand the agreed meaning, context and intended use of terms associated with the data.</p>\n        <h3>If you provide or manage data</h3>\n        <p>Check the Data Glossary when documenting your data to determine whether a shared term or definition already exists. Where an applicable shared definition exists, reference or align your documentation with it.</p>\n        <p><a class=\"text-action\" href=\"https://dev.developer.gov.bc.ca/docs/default/component/connected-services-semantics/\" target=\"_blank\" rel=\"noopener\">Search the Connected Services Data Glossary<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>How it relates to other semantic resources</h2>\n        <p>The Data Glossary is one part of the broader Connected Services semantic layer.</p>\n        <ul class=\"clean-list\"><li><strong>The Connected Services Data Glossary</strong> defines shared business and technical concepts.</li><li><strong>Data dictionaries</strong> document how those concepts are represented in fields and data structures.</li><li><strong>Taxonomy</strong> organizes concepts so information can be classified and discovered consistently.</li></ul>\n        <p>Together, these resources help connect information through shared meaning.</p>\n      </section>"
  },
  "taxonomy": {
    "title": "Taxonomy",
    "nav": "Taxonomy",
    "group": "Semantics",
    "intro": "The Connected Services Taxonomy organizes data into a consistent hierarchy so it can be classified, discovered and understood across government.",
    "body": "\n      <section>\n        <p>The Taxonomy moves from the broad business context of the data to the specific source and access method. It supports both the business meaning of data and the technical context needed to find and use it.</p>\n        <p>Using a shared taxonomy helps create a common semantic language across programs and services, making data easier to find, understand, integrate and reuse.</p>\n      </section>\n      <section>\n        <h2>Why Taxonomy matters</h2>\n        <p>A consistent Taxonomy helps teams:</p>\n        <ul class=\"clean-list\"><li>Classify data using shared concepts and terminology</li><li>Find and understand data more easily</li><li>Reduce duplication across programs and systems</li><li>Support consistent interpretation of data across government</li><li>Improve data integration and reuse</li><li>Support the “Tell Us Once” approach to whole-of-government service delivery</li></ul>\n      </section>\n      <section>\n        <h2>How Taxonomy is structured</h2>\n        <p>The Connected Services Taxonomy combines conceptual classification with operational metadata in a single hierarchy.</p>\n        <h3>Conceptual taxonomy</h3>\n        <p>The conceptual levels describe the business meaning and context of the data:</p>\n        <p><strong>Context → Subject Area → Entity → Role</strong></p>\n        <h3>Operational metadata</h3>\n        <p>The operational levels describe where the data comes from and how it can be accessed:</p>\n        <p><strong>Source → Access Channel</strong></p>\n        <p>Together, these levels create a consistent path from the broad purpose of the data to the specific way it is provided.</p>\n      </section>\n      <section>\n        <h2>Hierarchy levels</h2>\n        <h3>Context</h3>\n        <p>The broad, real-world category that the data supports.</p>\n        <p>Context provides an entry point for data discovery and can support reporting across broad areas of government activity.</p>\n        <h3>Subject Area</h3>\n        <p>A major topic or business grouping within a Context, such as a specific business function.</p>\n        <p>Subject Areas help organize data around areas of responsibility and support accountability at a functional level.</p>\n        <h3>Entity</h3>\n        <p>The core thing or object that the data describes.</p>\n        <p>Entities are intended to be program- and system-independent and form part of a shared, stable vocabulary across government.</p>\n        <h3>Role</h3>\n        <p>Describes how an Entity participates in a particular program, process or use case.</p>\n        <p>Roles add contextual meaning and allow attributes to be associated with a specific use of an Entity.</p>\n        <h3>Source</h3>\n        <p>The definitive source system where data for a particular subject area is created, maintained and shared.</p>\n        <h3>Access Channel</h3>\n        <p>The channel through which the data is accessed from the Source.</p>\n      </section>\n      <section>\n        <h2>What this means for providers</h2>\n        <p>The Taxonomy provides the shared structure used to classify and organize data within Connected Services.</p>\n        <p>When preparing data for Connected Services, providers should understand:</p>\n        <ul class=\"clean-list\"><li>The business context their data supports</li><li>The subject area the data belongs to</li><li>The concepts or entities the data represents</li><li>The source where the data is created and maintained</li><li>The channel through which the data is accessed</li></ul>\n        <div class=\"prototype-note\"><p><strong>Placeholder:</strong> The process for assigning, reviewing or updating Taxonomy classifications still needs to be confirmed. Once that process is established, this section should explain what information providers need to supply and how classifications are created or changed.</p></div>\n      </section>\n      <section>\n        <h2>Why this structure is used</h2>\n        <p>The Taxonomy is designed to support both semantic consistency and practical implementation.</p>\n        <p>It:</p>\n        <ul class=\"clean-list\"><li>Builds on established standards and patterns by using terminology influenced by DMBOK and existing data-governance practices</li><li>Uses established definitions to reduce the need to redefine common concepts</li><li>Supports shared vocabulary across programs and services</li><li>Aligns with data catalogue tools and operational workflows so the structure can be applied in practice</li><li>Supports future growth without requiring the current hierarchy to be redesigned</li></ul>\n      </section>\n      <section>\n        <h2>Future evolution</h2>\n        <p>As Connected Services semantic capabilities mature, the Taxonomy may evolve to:</p>\n        <ul class=\"clean-list\"><li>More formally separate conceptual taxonomy from operational metadata</li><li>Establish semantic relationships across entities and roles</li><li>Expand alignment with external standards and ontologies</li><li>Support machine-readable representations for advanced interoperability and automation</li></ul>\n        <p>These enhancements would build on the existing structure while maintaining the current Taxonomy foundation.</p>\n      </section>\n      <section>\n        <h2>Need help?</h2>\n        <p>Contact us if you need help understanding the Taxonomy or determining how your data fits within the structure.</p>\n        <p><a class=\"text-action\" href=\"#help\" data-page=\"help\">Get help with Taxonomy questions<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>"
  },
  "help": {
    "title": "Help and support",
    "nav": "Help and support",
    "group": "Help and support",
    "intro": "Use this page if you need help understanding what applies to your data, preparing for onboarding, or finding the right guidance.",
    "body": "\n      <section>\n        <h2>Contact Connected Services</h2>\n        <div class=\"prototype-note\"><p><strong>Placeholder only.</strong> The support model for Connected Services still needs to be confirmed as a coordination decision. The intended experience is to provide users with a <strong>single point of contact</strong> rather than requiring them to determine which team should handle their question. Requests would be routed to the appropriate team behind the scenes. The contact method, ownership and internal routing process still need to be confirmed.</p></div>\n        <p><a class=\"text-action\" href=\"#\" data-placeholder-action=\"Contact Connected Services — contact method TBD\">Contact Connected Services<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></p>\n      </section>\n      <section>\n        <h2>Find a resource</h2>\n        <p>You may also be able to find what you need in the guidance below.</p>\n        <div class=\"consumer-stacked-links\"><a class=\"text-action\" href=\"#designation\" data-page=\"designation\">Authoritative Data Designation Process<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a><a class=\"text-action\" href=\"https://bcgov.sharepoint.com/:w:/r/teams/00108/Shared%20Documents/TM_ADR/OPS%20Authoritative%20Data%20Designation/Process%20Materials/4-ADDP%20Candidate%20Dataset%20Submission%20Form.docx?d=w2fdb5722abec44bab1505dfcbb84365b&amp;csf=1&amp;web=1&amp;e=LTkOHf\" target=\"_blank\" rel=\"noopener\">Complete the Candidate Dataset Submission Form<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a><a class=\"text-action\" href=\"#data-register-standard\" data-page=\"data-register-standard\">Data Register Standard<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a><a class=\"text-action\" href=\"#glossary\" data-page=\"glossary\">Search the Connected Services Data Glossary<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a><a class=\"text-action\" href=\"#taxonomy\" data-page=\"taxonomy\">Learn about Taxonomy<svg aria-hidden=\"true\"><use href=\"#i-chevron\"></use></svg></a></div>\n      </section>"
  },
};
const NAV_TREE = [
  {label: "About data", page: "all-data"},
  {label: "Find datasets and APIs", page: "consumer"},
  {label: "Provide data", page: "provider", children: [
    {label: "Publishing a dataset", page: "standard-publishing"},
    {label: "High-value data", page: "high-value"},
    {label: "Authoritative data", page: "authoritative", children: [
      {label: "Authoritative Data Designation Process overview", page: "designation"}
    ]},
    {label: "Data registers", page: "data-registers", children: [
      {label: "Data Register Standard", page: "data-register-standard"}
    ]}
  ]},
  {label: "Semantics", page: "semantics", children: [
    {label: "Data dictionaries", page: "data-dictionary"},
    {label: "Connected Services Data Glossary", page: "glossary"},
    {label: "Taxonomy", page: "taxonomy"}
  ]},
  {label: "Help and support", page: "help"}
];
const PAGE_ORDER = Object.keys(PAGES);
const HIDDEN_ROUTES = new Set();
const PAGE_FLOW = {
  "consumer": {back: "all-data"},
  "provider": {back: "all-data", next: "high-value", nextLabel: "High-value data"},
  "standard-publishing": {back: "provider", backLabel: "Back to Provide data", lockBack: true},
  "high-value": {back: "provider", backLabel: "Back to Provide data", lockBack: true, next: "provider", nextLabel: "Continue provider journey"},
  "authoritative": {back: "provider", backLabel: "Back to Provide data", lockBack: true, next: "designation", nextLabel: "Authoritative Data Designation Process overview"},
  "designation": {back: "authoritative", backLabel: "Back to Authoritative data", lockBack: true, next: "data-registers", nextLabel: "Decide whether to use a data register"},
  "data-registers": {back: "designation", next: "data-register-standard", nextLabel: "Review the Data Register Standard"},
  "data-register-standard": {back: "data-registers"},
  "semantics": {back: "provider", next: "data-dictionary", nextLabel: "Data dictionaries"},
  "data-dictionary": {back: "semantics", next: "glossary", nextLabel: "Connected Services Data Glossary"},
  "glossary": {back: "data-dictionary", next: "taxonomy", nextLabel: "Taxonomy"},
  "taxonomy": {back: "glossary"},
  "help": {back: "all-data"}
};

const article = document.getElementById('article');
const localNav = document.getElementById('local-nav');
const toast = document.getElementById('toast');
const searchInput = document.getElementById('doc-search');
const searchResults = document.getElementById('search-results');
let currentPage = null;
let previousPage = null;

function escapeHTML(value) {
  return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}
function showToast(message) {
  toast.textContent = message;
  toast.classList.add('show');
  window.clearTimeout(showToast.timer);
  showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 3000);
}
function navNodeContains(node, id) {
  return node.page === id || (node.children || []).some(child => navNodeContains(child, id));
}
function renderNavNode(node, level=1) {
  const containsCurrent = navNodeContains(node, currentPage);
  const children = node.children || [];
  const childHTML = children.map(child => renderNavNode(child, level + 1)).join('');
  if (!node.page) {
    return `<div class="local-nav-static local-nav-level-${level} ${containsCurrent ? 'section-active' : ''}">${escapeHTML(node.label)}</div>${childHTML}`;
  }
  const isCurrent = node.page === currentPage;
  return `<a href="#${node.page}" data-page="${node.page}" class="local-nav-level-${level} ${isCurrent ? 'active' : containsCurrent ? 'section-active' : ''}" ${isCurrent ? 'aria-current="page"' : ''}>${escapeHTML(node.label)}</a>${childHTML}`;
}
function renderLocalNav() {
  localNav.innerHTML = `<h2 class="local-nav-title">ADR TechDocs</h2><div class="local-nav-tree">${NAV_TREE.map(item => renderNavNode(item, 1)).join('')}</div>`;
}
function findNavPath(id, nodes=NAV_TREE, path=[]) {
  for (const node of nodes) {
    const nextPath = [...path, node];
    if (node.page === id) return nextPath;
    if (node.children) {
      const found = findNavPath(id, node.children, nextPath);
      if (found) return found;
    }
  }
  return null;
}
function renderBreadcrumbs(id, page) {
  const separator = `<svg aria-hidden="true"><use href="#i-chevron"></use></svg>`;
  const items = [
    `<a href="#all-data" data-page="all-data">Documentation</a>`,
    `<a href="#all-data" data-page="all-data">Connected Services</a>`
  ];

  const path = findNavPath(id) || [];
  for (const node of path) {
    // Static navigation groupings appear as text in the breadcrumb.
    if (!node.page) {
      items.push(`<span>${escapeHTML(node.label)}</span>`);
      continue;
    }
    if (node.page === id) {
      items.push(`<span aria-current="page">${escapeHTML(page.title)}</span>`);
    } else {
      items.push(`<a href="#${node.page}" data-page="${node.page}">${escapeHTML(node.label)}</a>`);
    }
  }

  // Fallback for any prototype-only route that is not represented in the visible tree.
  if (!path.length) items.push(`<span aria-current="page">${escapeHTML(page.title)}</span>`);
  return items.join(separator);
}
function renderPageFooter(id) {
  const flow = PAGE_FLOW[id] || {};
  const contextualBack = previousPage && previousPage !== id && PAGES[previousPage] ? previousPage : null;
  const backId = flow.lockBack ? flow.back : contextualBack || flow.back;
  const nextId = flow.next;
  const links = [];

  if (backId && PAGES[backId]) {
    const label = flow.backLabel || `Back to ${PAGES[backId].title}`;
    links.push(`<a class="prev" href="#${backId}" data-page="${backId}"><svg aria-hidden="true"><use href="#i-chevron"></use></svg>${escapeHTML(label)}</a>`);
  }
  if (nextId && PAGES[nextId]) {
    const label = flow.nextLabel || PAGES[nextId].title;
    links.push(`<a class="next" href="#${nextId}" data-page="${nextId}">Next: ${escapeHTML(label)}<svg aria-hidden="true"><use href="#i-chevron"></use></svg></a>`);
  }

  return links.length ? `<nav class="page-nav" aria-label="Page navigation">${links.join('')}</nav>` : '';
}
function renderPage(id, anchor='') {
  if (!PAGES[id]) id = 'all-data';
  const origin = currentPage;
  if (origin && origin !== id) previousPage = origin;
  currentPage = id;
  const page = PAGES[id];
  const intro = page.intro ? (id === 'provider' ? `<div class="provider-purpose"><strong>${escapeHTML(page.intro)}</strong></div>` : `<p class="lead">${escapeHTML(page.intro)}</p>`) : '';
  article.innerHTML = `
    <nav class="breadcrumbs" aria-label="Breadcrumb">${renderBreadcrumbs(id,page)}</nav>
    ${page.label ? `<p class="subtle-label page-type-label">${escapeHTML(page.label)}</p>` : ''}
    <h1>${escapeHTML(page.title)}</h1>
    ${intro}
    ${page.body}
    ${renderPageFooter(id)}`;
  renderLocalNav();
  document.title = `${page.title} | B.C. government DevHub`;
  document.getElementById('main-content').focus({preventScroll:true});
  window.requestAnimationFrame(() => {
    const target = anchor ? document.getElementById(anchor) : null;
    if (target) target.scrollIntoView({behavior: 'auto', block: 'start'});
    else window.scrollTo(0,0);
  });
  closeMobileNavigation();
}
function handlePageClick(event) {
  const link = event.target.closest('[data-page]');
  if (!link) return;
  event.preventDefault();
  renderPage(link.dataset.page, link.dataset.anchor || '');
}
document.addEventListener('click', handlePageClick);


document.addEventListener('click', event => {
  const action = event.target.closest('[data-placeholder-action]');
  if (!action) return;
  event.preventDefault();
  showToast(`${action.dataset.placeholderAction} is a placeholder destination in this prototype.`);
});
function stripHTML(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  return d.textContent || '';
}
function renderSearch() {
  const query = searchInput.value.trim().toLowerCase();
  if (!query) { searchResults.classList.remove('open'); searchResults.innerHTML = ''; return; }
  const ids = Object.keys(PAGES).filter(id => !HIDDEN_ROUTES.has(id));
  const matches = ids.filter(id => {
    const p = PAGES[id];
    return `${p.title} ${p.nav} ${p.group} ${p.intro} ${stripHTML(p.body)}`.toLowerCase().includes(query);
  }).slice(0,10);
  searchResults.innerHTML = matches.length ? matches.map(id => `<button class="search-result" data-page="${id}"><strong>${escapeHTML(PAGES[id].title)}</strong><span>${escapeHTML(PAGES[id].group)}</span></button>`).join('') : '<div class="search-empty">No matching prototype pages.</div>';
  searchResults.classList.add('open');
}
searchInput.addEventListener('input', renderSearch);
document.getElementById('search-clear').addEventListener('click', () => { searchInput.value=''; renderSearch(); searchInput.focus(); });
document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) searchResults.classList.remove('open'); });

document.querySelectorAll('[data-global]').forEach(item => item.addEventListener('click', () => {
  if (item.dataset.global === 'search') { searchInput.focus(); closeMobileNavigation(); }
  else if (item.dataset.global !== 'docs') showToast(`${item.textContent.trim()} is outside this prototype.`);
}));
const sidebar = document.getElementById('global-sidebar');
const scrim = document.getElementById('sidebar-scrim');
const menuOpen = document.getElementById('menu-open');
const localToggle = document.getElementById('local-nav-toggle');
function openMobileNavigation() { sidebar.classList.add('open'); scrim.classList.add('open'); menuOpen.setAttribute('aria-expanded','true'); }
function closeMobileNavigation() { sidebar.classList.remove('open'); scrim.classList.remove('open'); menuOpen.setAttribute('aria-expanded','false'); }
menuOpen.addEventListener('click', openMobileNavigation);
scrim.addEventListener('click', closeMobileNavigation);
localToggle.addEventListener('click', () => {
  const open = localNav.classList.toggle('open');
  localToggle.setAttribute('aria-expanded', String(open));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMobileNavigation(); searchResults.classList.remove('open'); } });
renderPage('all-data');
</script>
</body>
</html>
